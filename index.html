<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HR Analytics Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#eef8f0;--sf:#fff;--sf2:#f5fbf6;--bd:#d5ebda;--tx:#133524;--mu:#5b7a66;--pr:#2e9e5b;--pd:#14532d;--pl:#cdeed8;--bad:#d4543a;--ok:#1f8a4c;--sh:0 1px 2px rgba(20,83,45,.06),0 6px 20px rgba(20,83,45,.05)}
[data-theme=dark]{--bg:#0e1a13;--sf:#15251c;--sf2:#1a2d22;--bd:#25402f;--tx:#e3f3e8;--mu:#8fb09b;--pr:#4fcb84;--pd:#9be3b8;--pl:#1f3a2a;--bad:#ff7a60;--ok:#4fcb84;--sh:none}
*{box-sizing:border-box;margin:0}body{font-family:Figtree,system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:14px}
header{position:sticky;top:0;z-index:20;background:var(--sf);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:14px;padding:12px 24px;flex-wrap:wrap}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#2e9e5b,#86e0a6);display:grid;place-items:center;color:#fff;font-weight:800}
h1{font-size:18px;font-weight:800;letter-spacing:-.01em}.sub{color:var(--mu);font-size:12px}
.sp{flex:1}.btn{border:1px solid var(--bd);background:var(--sf2);color:var(--tx);padding:8px 13px;border-radius:10px;font:600 13px Figtree,sans-serif;cursor:pointer}.btn:hover{border-color:var(--pr)}.btn.p{background:var(--pr);color:#fff;border-color:var(--pr)}
:focus-visible{outline:2px solid var(--pr);outline-offset:2px}
main{max-width:1500px;margin:0 auto;padding:20px 24px 60px}
.bar{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:14px 16px;box-shadow:var(--sh);display:grid;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.f{display:flex;flex-direction:column;gap:4px;min-width:150px}.f label{font-size:11.5px;color:var(--mu);font-weight:600}
select,input[type=search]{border:1px solid var(--bd);background:var(--sf2);color:var(--tx);padding:8px 10px;border-radius:10px;font:500 13px Figtree,sans-serif}
.chip,.mp{border:1px solid var(--bd);background:var(--sf2);color:var(--tx);padding:6px 13px;border-radius:99px;font:600 12.5px Figtree,sans-serif;cursor:pointer}
.chip.on,.mp.on{background:var(--pr);border-color:var(--pr);color:#fff}.mp.no{opacity:.5}.mp.no.on{opacity:1}
.mlab{font-size:11.5px;color:var(--mu);font-weight:600;margin-right:4px}
h2{font-size:16px;font-weight:800;margin:26px 0 12px;display:flex;align-items:center;gap:10px}h2 small{font-weight:500;color:var(--mu);font-size:12px}
.kg{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:12px}
.k{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:14px 15px;box-shadow:var(--sh)}
.k .l{color:var(--mu);font-size:12px;font-weight:600}.k .v{font-size:25px;font-weight:800;margin:5px 0 3px;letter-spacing:-.02em}
.k .d{font-size:11.5px;font-weight:600;color:var(--mu)}.k .d.g{color:var(--ok)}.k .d.b{color:var(--bad)}
.k.hero{background:linear-gradient(135deg,#2e9e5b,#1f7a45);border:0}.k.hero .l,.k.hero .d,.k.hero .v{color:#fff}
.ins{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.ins div{background:var(--pl);border-radius:12px;padding:9px 13px;font-size:12.5px;color:var(--pd);font-weight:600}
.tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.c{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:14px;box-shadow:var(--sh)}
.c .t{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;font-weight:700;font-size:13px}.c .t span{color:var(--pr);font-weight:800}
.cv{position:relative;height:130px}.cv.big{height:300px}
.g2{display:grid;grid-template-columns:2fr 1fr;gap:12px}.g2b{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.tw{overflow:auto;max-height:480px;border:1px solid var(--bd);border-radius:14px;background:var(--sf)}
table{border-collapse:collapse;width:100%;font-size:13px}th{position:sticky;top:0;background:var(--pl);color:var(--pd);text-align:right;padding:10px 12px;cursor:pointer;white-space:nowrap;font-weight:700}
th:nth-child(-n+3),td:nth-child(-n+3){text-align:left}td{padding:9px 12px;border-top:1px solid var(--bd);text-align:right;font-variant-numeric:tabular-nums}tr:hover td{background:var(--sf2)}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11.5px;font-weight:700}.pill.h{background:#fde3dc;color:#a3321c}.pill.m{background:#fff0c9;color:#7a5a00}.pill.l{background:var(--pl);color:var(--pd)}
.msg{padding:40px;text-align:center;color:var(--mu)}.err{background:#fde3dc;color:#8b2a16;padding:12px 16px;border-radius:12px;margin-top:12px;display:none}
@media(max-width:900px){.g2,.g2b{grid-template-columns:1fr}main{padding:14px}header{padding:10px 14px}}
@media(prefers-reduced-motion:no-preference){.k,.c{transition:transform .15s}.k:hover,.c:hover{transform:translateY(-2px)}}

.tc{cursor:pointer}.tc:hover{border-color:var(--pr)}.hint{font-size:11px;color:var(--pr);font-weight:700;margin-top:6px;text-align:right}.k[data-k]{cursor:pointer}
.dv{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;grid-template-columns:270px 1fr}.dv.on{display:grid;animation:pop .22s}@keyframes pop{from{opacity:0;transform:scale(.985)}}
.dside{overflow:auto;background:var(--sf);border-right:1px solid var(--bd);padding:12px;display:flex;flex-direction:column;gap:4px}
.ds{display:flex;justify-content:space-between;gap:8px;border:0;background:transparent;color:var(--tx);padding:9px 11px;border-radius:11px;font:600 12.5px Figtree,sans-serif;cursor:pointer;text-align:left}.ds:hover{background:var(--sf2)}.ds.on{background:var(--pr);color:#fff}.ds b{font-weight:800}
.dmain{overflow:auto;padding:20px 26px 60px}.dh{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}.dh h2{margin:0;font-size:24px}
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}.sg div{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:11px 13px}.sg small{display:block;color:var(--mu);font-size:11.5px;font-weight:600}.sg b{font-size:18px;font-weight:800}
h3{font-size:14px;font-weight:800;margin:22px 0 10px}.ug{color:var(--ok)!important}.ub{color:var(--bad)!important}.nd{color:var(--mu)}
.bl{display:grid;grid-template-columns:140px 1fr 84px;gap:10px;align-items:center;padding:5px 0;font-size:12.5px}.bl.ck{cursor:pointer}.bl.ck:hover .bn{color:var(--pr)}.bn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.bt{background:var(--pl);border-radius:99px;height:10px;overflow:hidden}.bt i{display:block;height:100%;background:linear-gradient(90deg,#6cc78f,#2e9e5b);border-radius:99px;animation:gr .7s}@keyframes gr{from{width:0}}.bl b{text-align:right}
.mt tr.mr{cursor:pointer}.mt tr.sel td{background:var(--pl)}.mt td,.mt th{text-align:right}.mt td:first-child,.mt th:first-child{text-align:left}
@media(max-width:900px){.dv.on{grid-template-columns:1fr;grid-template-rows:auto 1fr}.dside{flex-direction:row;border-right:0;border-bottom:1px solid var(--bd);overflow-x:auto}.ds{white-space:nowrap;gap:10px}.dmain{padding:14px}.bl{grid-template-columns:100px 1fr 70px}}
</style></head><body>
<header><div class="logo">HR</div><div><h1>HR Analytics Dashboard</h1><div class="sub" id="st">Loading data…</div></div><div class="sp"></div>
<button class="btn" id="rf">Refresh data</button><label class="btn">Upload CSV<input type="file" id="up" accept=".csv" hidden></label><button class="btn" id="th">Dark mode</button></header>
<main>
<div class="err" id="er"></div>
<div class="bar">
<div class="row"><div class="f"><label>Company</label><select id="fc"></select></div><div class="f"><label>Year</label><select id="fy"></select></div><div class="f"><label>Department</label><select id="fd"></select></div><div class="f"><label>Section</label><select id="fs"></select></div><div class="f" style="justify-content:flex-end"><button class="btn" id="rs">Reset view</button></div></div>
<div class="row" id="cc"><span class="mlab">Quick company</span></div>
<div class="row" id="mm"><span class="mlab">Month</span></div></div>
<div id="app"><div class="msg">Loading…</div></div>
</main>
<div id="dv" class="dv"></div>
<script>
const CSV='https://docs.google.com/spreadsheets/d/e/2PACX-1vSMBPrqkOVprAn_sLjg2NmzGCimRx13XoDClYB7a4HMcX0j6MjqH9x7u9Z-NlWG2vAEzv16nPaMOIUU/pub?gid=1670338970&single=true&output=csv';
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],$=s=>document.querySelector(s);
const PAL=['#2e9e5b','#6cc78f','#14532d','#a7e3bd','#1f7a45','#4fb67a','#0e3b22','#8fd5aa','#3aa76d','#c9f0d6'];
let RAW=[],S={co:'All',y:0,m:'latest',dept:'All',sec:'All',q:'',sk:'otc',sd:-1},CH={};
const num=v=>{const t=String(v??'').replace(/[,\s%]/g,'');return t===''||t==='-'?0:(parseFloat(t)||0)};
const fN=v=>Math.round(v).toLocaleString('en-US'),fP=v=>(v||0).toFixed(1)+'%';
const fC=v=>v>=1e6?(v/1e6).toFixed(2)+'M':v>=1e4?(v/1e3).toFixed(1)+'K':fN(v);
function parseCSV(t){const r=[];let row=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}else if(c=='"')q=true;else if(c==','){row.push(f);f=''}else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;row.push(f);r.push(row);row=[];f=''}else f+=c}if(f!==''||row.length){row.push(f);r.push(row)}return r}
function ingest(text){
 const t=parseCSV(text),h=t[0].map(s=>s.trim());
 RAW=t.slice(1).filter(r=>r.length>5).map(r=>{const o={};h.forEach((k,i)=>o[k]=r[i]??'');
  const m=String(o.Month).trim().match(/^([A-Za-z]{3})[a-z]*[-\s'\/]*(\d{2,4})$/);if(!m)return null;
  const mi=MN.findIndex(x=>x.toLowerCase()==m[1].toLowerCase());if(mi<0)return null;let y=+m[2];if(y<100)y+=2000;
  const d={};h.forEach(k=>{if(!['Company','Department','Section','Month'].includes(k))d[k]=num(o[k])});
  return{co:o.Company.trim(),dept:o.Department.trim(),sec:o.Section.trim(),m:mi,y,key:y*12+mi,d}}).filter(Boolean);
 if(!RAW.length)throw new Error('No rows with a valid Month (e.g. Sep-26) were found.');
 S.y=Math.max(...RAW.map(r=>r.y));
}
function agg(rs){if(!rs.length)return null;
 const s=k=>rs.reduce((a,r)=>a+(r.d[k]||0),0),lk=Math.max(...rs.map(r=>r.key)),hc=rs.filter(r=>r.key===lk),h=k=>hc.reduce((a,r)=>a+(r.d[k]||0),0);
 const w=k=>{let n=0,d=0;rs.forEach(r=>{const x=r.d['Scheduled Hours'];if(x>0){n+=r.d[k]*x;d+=x}});return d?n/d:0};
 const sched=s('Scheduled Hours'),act=s('Actual Hours'),cur=h('Current Headcount'),appr=h('Approved Headcount');
 return{sched,act,cur,appr,active:appr?cur/appr*100:0,avs:sched?act/sched*100:0,ot:s('Total OT Hours'),otc:s('OT Cost'),otp:sched?s('Total OT Hours')/sched*100:0,
 tpot:s('TP Total OT Hours'),tpc:s('TP OT Cost'),tpp:sched?s('TP Total OT Hours')/sched*100:0,abs:w('Absenteeism %'),lvp:w('Leaves %'),late:w('Late Arrival %'),early:w('Early Out %'),
 join:s('Joiners'),lv:s('Leavers'),pend:s('Pending Final Settlement')}}
const has=a=>a&&(a.sched>0||a.cur>0||a.otc>0||a.tpc>0);
const KP=[
{k:'cur',l:'Current headcount',f:fN,u:1,hero:1,sub:a=>'Approved '+fN(a.appr)},{k:'active',l:'Active employees',f:fP,u:1},{k:'abs',l:'Absenteeism',f:fP,u:-1},{k:'lvp',l:'Leaves',f:fP,u:-1},
{k:'late',l:'Late arrival',f:fP,u:-1},{k:'early',l:'Early out',f:fP,u:-1},{k:'avs',l:'Actual vs std hours',f:fP,u:1},{k:'sched',l:'Total scheduled hours',f:fN,u:0},
{k:'ot',l:'Total OT hours',f:fN,u:-1,sub:a=>'OT '+fP(a.otp)},{k:'otp',l:'OT % of hours',f:fP,u:-1},{k:'otc',l:'OT cost (PKR)',f:fC,u:-1,hero:1},{k:'tpot',l:'TP OT hours',f:fN,u:-1,sub:a=>'TP OT '+fP(a.tpp)},{k:'tpc',l:'TP OT cost (PKR)',f:fC,u:-1},
{k:'join',l:'Joiners',f:fN,u:1},{k:'lv',l:'Leavers',f:fN,u:-1},{k:'pend',l:'Pending final settlement',f:fN,u:-1}];
const TR=[['cur','Headcount','b','👥'],['active','Active employee %','l','✅'],['abs','Absenteeism %','l','🚫'],['lvp','Leaves %','l','🏖️'],['late','Late arrival %','l','⏰'],['early','Early out %','l','🚪'],['avs','Actual vs std hours %','l','🎯'],['sched','Total hours','b','🕒'],['ot','Total OT hours','b','⚡'],['otp','OT %','l','📈'],['otc','OT cost','b','💰'],['tpot','TP OT hours','b','🧰'],['tpc','TP OT cost','b','💸'],['join','Joiners','b','🎉'],['lv','Leavers','b','👋'],['pend','Pending final settlement','b','📋']];
const AL=['LFA','Vehicle Allowance','Relocation Allowance','Transportation Allowance','Fare Allowance','Mobile Allowance','Tardiness Reimbursment','Admin Reimbursment','Medical/OPD','Advance Salary'];
const base=()=>RAW.filter(r=>r.y==S.y&&(S.co=='All'||r.co==S.co)&&(S.dept=='All'||r.dept==S.dept)&&(S.sec=='All'||r.sec==S.sec));
const trend=b=>MN.map((_,i)=>{const a=agg(b.filter(r=>r.m==i));return has(a)?a:null});
const fmtFor=k=>KP.find(x=>x.k==k).f;
function fill(id,vals,cur,all){const e=$(id);e.innerHTML=(all?`<option>All</option>`:'')+vals.map(v=>`<option ${v==cur?'selected':''}>${v}</option>`).join('')}
function filters(){
 const uniq=a=>[...new Set(a)].sort();
 fill('#fc',uniq(RAW.map(r=>r.co)),S.co,1);fill('#fy',uniq(RAW.map(r=>r.y)),S.y);
 const r1=RAW.filter(r=>S.co=='All'||r.co==S.co);fill('#fd',uniq(r1.map(r=>r.dept)),S.dept,1);
 fill('#fs',uniq(r1.filter(r=>S.dept=='All'||r.dept==S.dept).map(r=>r.sec)),S.sec,1);
 const cos=['All',...uniq(RAW.map(r=>r.co))].slice(0,9);
 $('#cc').innerHTML='<span class="mlab">Quick company</span>'+cos.map(c=>`<button class="chip ${c==S.co?'on':''}" data-co="${c}">${c}</button>`).join('');
}
function months(tr){
 $('#mm').innerHTML='<span class="mlab">Month</span>'+MN.map((m,i)=>`<button class="mp ${tr[i]?'':'no'} ${S.m==i||(S.m=='latest'&&i==curM(tr))?'on':''}" data-m="${i}">${m}</button>`).join('')+`<button class="mp ${S.m=='ytd'?'on':''}" data-m="ytd">Full year</button>`}
function curM(tr){if(S.m=='latest'||S.m=='ytd'){for(let i=11;i>=0;i--)if(tr[i])return i;return 0}return S.m}
function mk(id,cfg){if(CH[id])CH[id].destroy();const e=document.getElementById(id);if(!e)return;CH[id]=new Chart(e,cfg)}
function render(){
 filters();const b=base(),tr=trend(b),cm=curM(tr);months(tr);
 const rs=S.m=='ytd'?b:b.filter(r=>r.m==cm),a=agg(rs);
 const per=S.m=='ytd'?'Jan–Dec '+S.y:MN[cm]+' '+S.y;CUR={tr,cm,rs,per,b};
 if(!has(a)){$('#app').innerHTML=`<div class="msg"><b>No data for ${per} yet.</b><br>Select another month, or add this month's rows to the Google Sheet and press Refresh data.</div>`;
  $('#app').innerHTML+=`<h2>Jan–Dec trends</h2><div class="tg" id="tg"></div>`;trends(tr,cm);return}
 const prev=S.m=='ytd'?null:tr.slice(0,cm).reverse().find(Boolean);
 const kp=KP.map(x=>{let d='',c='';if(prev&&x.u!==undefined){const df=a[x.k]-prev[x.k];if(Math.abs(df)>1e-9){d=(df>0?'▲ ':'▼ ')+x.f(Math.abs(df))+' vs prev month';c=x.u?((df>0)==(x.u>0)?'g':'b'):''}}
  return `<div class="k ${x.hero?'hero':''}" data-k="${x.k}"><div class="l">${x.l}</div><div class="v">${x.f(a[x.k])}</div><div class="d ${c}">${x.sub?x.sub(a):d||'&nbsp;'}</div></div>`}).join('');
 const grp=(by)=>{const m={};rs.forEach(r=>(m[r[by]]??=[]).push(r));return Object.entries(m).map(([k,v])=>({k,a:agg(v)})).filter(x=>has(x.a))};
 const secs=grp('sec'),top=[...secs].sort((x,y)=>y.a.otc+y.a.tpc-x.a.otc-x.a.tpc)[0],ab=[...secs].filter(x=>x.a.cur>0).sort((x,y)=>y.a.abs-x.a.abs)[0],lt=[...secs].filter(x=>x.a.cur>0).sort((x,y)=>y.a.late-x.a.late)[0];
 $('#app').innerHTML=`<h2>Overview <small>${per} · ${S.co=='All'?'All companies':S.co}${S.dept!='All'?' · '+S.dept:''}${S.sec!='All'?' · '+S.sec:''}</small></h2><div class="kg">${kp}</div>
 <div class="ins">${top?`<div>Highest OT spend: ${top.k} (Rs ${fC(top.a.otc+top.a.tpc)})</div>`:''}${ab?`<div>Highest absenteeism: ${ab.k} (${fP(ab.a.abs)})</div>`:''}${lt?`<div>Most late arrivals: ${lt.k} (${fP(lt.a.late)})</div>`:''}</div>
 <h2>Month-wise trends <small>Jan–Dec ${S.y} · selected month highlighted · click any card for full detail</small></h2><div class="tg" id="tg"></div>
 <h2>Breakdown <small>${per}</small></h2><div class="g2"><div class="c"><div class="t">OT cost by department (own vs third party)</div><div class="cv big"><canvas id="c1"></canvas></div></div><div class="c"><div class="t">Allowances &amp; reimbursements</div><div class="cv big"><canvas id="c2"></canvas></div></div></div>
 <div class="g2b"><div class="c"><div class="t">Headcount by company (approved vs current)</div><div class="cv big"><canvas id="c3"></canvas></div></div><div class="c"><div class="t">Attendance quality by department (%)</div><div class="cv big"><canvas id="c4"></canvas></div></div></div>
 <h2>Section detail <small>${per}</small><span class="sp"></span><input type="search" id="q" placeholder="Search section or department" value="${S.q}"></h2><div class="tw" id="tb"></div>`;
 trends(tr,cm);
 const dg=grp('dept').sort((x,y)=>y.a.otc+y.a.tpc-x.a.otc-x.a.tpc).slice(0,12),gc=getComputedStyle(document.body).getPropertyValue('--mu');
 const ax={ticks:{color:gc},grid:{color:'rgba(120,160,135,.15)'}},base_={responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:gc,boxWidth:12}}}};
 mk('c1',{type:'bar',data:{labels:dg.map(x=>x.k),datasets:[{label:'Own OT cost',data:dg.map(x=>x.a.otc),backgroundColor:'#2e9e5b',borderRadius:5},{label:'TP OT cost',data:dg.map(x=>x.a.tpc),backgroundColor:'#a7e3bd',borderRadius:5}]},options:{...base_,indexAxis:'y',scales:{x:{...ax,stacked:true},y:{...ax,stacked:true}}}});
 const al=AL.map(k=>[k,rs.reduce((s,r)=>s+(r.d[k]||0),0)]).filter(x=>x[1]>0);
 mk('c2',{type:'doughnut',data:{labels:al.map(x=>x[0]),datasets:[{data:al.map(x=>x[1]),backgroundColor:PAL,borderWidth:0}]},options:{...base_,cutout:'62%',plugins:{legend:{position:'bottom',labels:{color:gc,boxWidth:10,font:{size:11}}}}}});
 const cg=grp('co');mk('c3',{type:'bar',data:{labels:cg.map(x=>x.k),datasets:[{label:'Approved',data:cg.map(x=>x.a.appr),backgroundColor:'#a7e3bd',borderRadius:5},{label:'Current',data:cg.map(x=>x.a.cur),backgroundColor:'#2e9e5b',borderRadius:5}]},options:{...base_,scales:{x:ax,y:ax}}});
 const dd=grp('dept').filter(x=>x.a.cur>0);
 mk('c4',{type:'bar',data:{labels:dd.map(x=>x.k),datasets:[{label:'Absenteeism',data:dd.map(x=>+x.a.abs.toFixed(1)),backgroundColor:'#2e9e5b',borderRadius:5},{label:'Late arrival',data:dd.map(x=>+x.a.late.toFixed(1)),backgroundColor:'#6cc78f',borderRadius:5},{label:'Leaves',data:dd.map(x=>+x.a.lvp.toFixed(1)),backgroundColor:'#14532d',borderRadius:5}]},options:{...base_,scales:{x:ax,y:ax}}});
 table(rs);$('#q').oninput=e=>{S.q=e.target.value;table(rs)};
}
function trends(tr,cm){const g=$('#tg');if(!g)return;const mu=getComputedStyle(document.body).getPropertyValue('--mu');
 g.innerHTML=TR.map(([k,l,,ic],i)=>{const v=tr[cm]?fmtFor(k)(tr[cm][k]):'–';return `<div class="c tc" data-i="${i}" tabindex="0"><div class="t">${ic} ${l}<span>${v}</span></div><div class="cv"><canvas id="t${i}"></canvas></div><div class="hint">Full detail ›</div></div>`}).join('');
 TR.forEach(([k,l,t],i)=>{const d=tr.map(x=>x?+x[k].toFixed(2):null),f=fmtFor(k),sel=S.m=='ytd'?-1:cm;
  mk('t'+i,{type:t=='b'?'bar':'line',data:{labels:MN,datasets:[{data:d,spanGaps:false,borderColor:'#2e9e5b',borderWidth:2.5,tension:.35,pointRadius:d.map((_,j)=>j==sel?5:3),pointBackgroundColor:'#2e9e5b',backgroundColor:t=='b'?d.map((_,j)=>j==sel?'#14532d':'#7fd4a0'):'rgba(46,158,91,.12)',fill:t!='b',borderRadius:4}]},
  options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>f(c.parsed.y)}}},scales:{x:{ticks:{color:mu,font:{size:10}},grid:{display:false}},y:{ticks:{color:mu,font:{size:10},maxTicksLimit:4},grid:{color:'rgba(120,160,135,.15)'},beginAtZero:true}}}})})}
function table(rs){const m={};rs.forEach(r=>(m[r.co+'|'+r.dept+'|'+r.sec]??=[]).push(r));
 const q=S.q.toLowerCase();let L=Object.entries(m).map(([k,v])=>({co:k.split('|')[0],dept:k.split('|')[1],sec:k.split('|')[2],...agg(v)})).filter(x=>has(x)&&(x.sec+x.dept).toLowerCase().includes(q));
 L.sort((a,b)=>typeof a[S.sk]=='string'?S.sd*-a[S.sk].localeCompare(b[S.sk]):S.sd*(a[S.sk]-b[S.sk]));
 const C=[['co','Company'],['dept','Department'],['sec','Section'],['cur','HC',fN],['ot','OT hrs',fN],['otc','OT cost',fN],['tpc','TP OT cost',fN],['abs','Absent',v=>pill(v,10,15)],['late','Late',v=>pill(v,5,15)],['avs','Act/Std',fP]];
 $('#tb').innerHTML=L.length?`<table><thead><tr>${C.map(c=>`<th data-s="${c[0]}">${c[1]}${S.sk==c[0]?(S.sd>0?' ▲':' ▼'):''}</th>`).join('')}</tr></thead><tbody>${L.map(x=>`<tr>${C.map(c=>`<td>${c[2]?c[2](x[c[0]]):x[c[0]]}</td>`).join('')}</tr>`).join('')}</tbody></table>`:'<div class="msg">No matching sections.</div>';
 document.querySelectorAll('th[data-s]').forEach(t=>t.onclick=()=>{const k=t.dataset.s;S.sd=S.sk==k?-S.sd:-1;S.sk=k;table(rs)})}
const pill=(v,a,b)=>`<span class="pill ${v>=b?'h':v>=a?'m':'l'}">${fP(v)}</span>`;
async function load(){$('#st').textContent='Loading data…';$('#er').style.display='none';
 try{const r=await fetch(CSV+'&t='+Date.now());if(!r.ok)throw new Error('HTTP '+r.status);ingest(await r.text());$('#st').textContent='Live from Google Sheet · updated '+new Date().toLocaleTimeString();try{render()}catch(e){console.error(e);$('#er').style.display='block';$('#er').textContent='Dashboard error: '+e.message;return}}
 catch(e){$('#st').textContent='Could not load live data';const x=$('#er');x.style.display='block';x.innerHTML='Could not reach the Google Sheet ('+e.message+'). Open this file from your website or a local server, or use <b>Upload CSV</b> to load a downloaded copy of the sheet.'}}
$('#rf').onclick=load;
$('#up').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{ingest(t);$('#er').style.display='none';$('#st').textContent='Loaded from '+f.name;render()}catch(x){$('#er').style.display='block';$('#er').textContent=x.message}})};
$('#th').onclick=()=>{const d=document.documentElement;const n=d.dataset.theme=='dark'?'':'dark';n?d.dataset.theme='dark':delete d.dataset.theme;$('#th').textContent=n?'Light mode':'Dark mode';if(RAW.length)render()};
$('#fc').onchange=e=>{S.co=e.target.value;S.dept='All';S.sec='All';render()};$('#fy').onchange=e=>{S.y=+e.target.value;render()};
$('#fd').onchange=e=>{S.dept=e.target.value;S.sec='All';render()};$('#fs').onchange=e=>{S.sec=e.target.value;render()};
$('#rs').onclick=()=>{S={...S,co:'All',m:'latest',dept:'All',sec:'All',q:''};S.y=Math.max(...RAW.map(r=>r.y));render()};
$('#cc').onclick=e=>{const c=e.target.dataset.co;if(c){S.co=c;S.dept='All';S.sec='All';render()}};
$('#mm').onclick=e=>{const m=e.target.dataset.m;if(m!==undefined){S.m=m=='ytd'?'ytd':+m;render()}};

let CUR={},DI=0,DT='bar';const SUMK=['sched','ot','otc','tpot','tpc','join','lv'];
function openDet(i){DI=(i+TR.length)%TR.length;$('#dv').classList.add('on');document.body.style.overflow='hidden';drawDet()}
function closeDet(){$('#dv').classList.remove('on');document.body.style.overflow='';if(CH.dc){CH.dc.destroy();delete CH.dc}}
function drawDet(){
 const [k,l,,ic]=TR[DI],kp=KP.find(x=>x.k==k),f=kp.f,u=kp.u,{tr,cm,rs,per}=CUR;
 const vals=tr.map(x=>x?x[k]:null),ok=vals.map((v,i)=>v===null?-1:i).filter(i=>i>=0);
 const cur=vals[cm],pi=ok.filter(i=>i<cm).pop(),dl=(cur!=null&&pi!=null)?cur-vals[pi]:null;
 const dc=d=>d==null||Math.abs(d)<1e-9||!u?'':((d>0)==(u>0)?'ug':'ub'),dt=d=>d==null?'–':(Math.abs(d)<1e-9?'No change':(d>0?'▲ ':'▼ ')+f(Math.abs(d)));
 const av=ok.length?ok.reduce((s,i)=>s+vals[i],0)/ok.length:0;
 const mx=ok.length?ok.reduce((a,i)=>vals[i]>vals[a]?i:a,ok[0]):null,mn=ok.length?ok.reduce((a,i)=>vals[i]<vals[a]?i:a,ok[0]):null;
 const st=[[MN[cm]+' '+S.y,cur!=null?f(cur):'–',''],['Change vs previous month',dt(dl),dc(dl)],['Monthly average',ok.length?f(av):'–',''],['Highest month',mx!=null?f(vals[mx])+' · '+MN[mx]:'–',''],['Lowest month',mn!=null?f(vals[mn])+' · '+MN[mn]:'–',''],['Months with data',ok.length+' of 12','']];
 if(SUMK.includes(k))st.push(['Year total',f(ok.reduce((s,i)=>s+vals[i],0)),'']);
 const gb=by=>{const m={};rs.forEach(r=>(m[r[by]]??=[]).push(r));return Object.entries(m).map(([n,v])=>{const a=agg(v);return{n,a,v:a[k]}}).filter(x=>has(x.a)).sort((x,y)=>y.v-x.v)};
 const bl=(arr,by,lim)=>{const A=arr.slice(0,lim),m=Math.max(...A.map(x=>x.v),1e-9);return A.length?A.map((x,j)=>`<div class="bl ${by!='sec'?'ck':''}" data-by="${by}" data-n="${x.n.replace(/"/g,'&quot;')}"><span class="bn" title="${x.n.replace(/"/g,'&quot;')}">${x.n}</span><div class="bt"><i style="width:${Math.max(2,Math.max(x.v,0)/m*100)}%;${u<0&&j<3&&x.v>0?'background:linear-gradient(90deg,#f0a35e,#d4543a)':''}"></i></div><b>${f(x.v)}</b></div>`).join(''):'<div class="msg">No data for this selection</div>'};
 const mrows=MN.map((m,i)=>{const p=ok.filter(j=>j<i).pop(),d=(vals[i]!=null&&p!=null)?vals[i]-vals[p]:null;return `<tr class="mr ${i==cm&&S.m!='ytd'?'sel':''}" data-mm="${i}"><td>${m}</td><td>${vals[i]!=null?f(vals[i]):'<span class="nd">No data</span>'}</td><td class="${dc(d)}">${dt(d)}</td></tr>`}).join('');
 const ss=$('.dside')?.scrollTop||0,filt=(S.co!='All'||S.dept!='All'||S.sec!='All');
 if(CH.dc){CH.dc.destroy();delete CH.dc}
 $('#dv').innerHTML=`<div class="dside">${TR.map(([kk,ll,,ii],j)=>`<button class="ds ${j==DI?'on':''}" data-j="${j}"><span>${ii} ${ll}</span><b>${tr[cm]?KP.find(x=>x.k==kk).f(tr[cm][kk]):'–'}</b></button>`).join('')}</div>
 <div class="dmain"><div class="dh"><button class="btn" data-nav="-1" aria-label="Previous trend">◀</button><div><div class="sub">Trend ${DI+1} of ${TR.length} · ${S.co=='All'?'All companies':S.co}${S.dept!='All'?' · '+S.dept:''}${S.sec!='All'?' · '+S.sec:''}</div><h2>${ic} ${l}</h2></div><button class="btn" data-nav="1" aria-label="Next trend">▶</button><span class="sp"></span>${filt?'<button class="btn" data-reset="1">Clear filters</button>':''}<button class="btn ${DT=='bar'?'p':''}" data-ty="bar">Bars</button><button class="btn ${DT=='line'?'p':''}" data-ty="line">Line</button><button class="btn" id="dx">Close ✕</button></div>
 <div class="row">${MN.map((m,i)=>`<button class="mp ${tr[i]?'':'no'} ${S.m!='ytd'&&i==cm?'on':''}" data-mm="${i}">${m}</button>`).join('')}<button class="mp ${S.m=='ytd'?'on':''}" data-mm="ytd">Full year</button></div>
 <div class="sg">${st.map(x=>`<div><small>${x[0]}</small><b class="${x[2]}">${x[1]}</b></div>`).join('')}</div>
 <div class="c"><div class="cv big"><canvas id="dc"></canvas></div></div>
 <div class="g2b"><div><h3>Month by month</h3><div class="tw" style="max-height:440px"><table class="mt"><thead><tr><th>Month</th><th>${l}</th><th>Change</th></tr></thead><tbody>${mrows}</tbody></table></div></div>
 <div><h3>By company <small class="nd">· click a bar to filter</small></h3>${bl(gb('co'),'co',10)}<h3>By department</h3>${bl(gb('dept'),'dept',12)}</div></div>
 <h3>Top sections · ${per}</h3>${bl(gb('sec'),'sec',12)}</div>`;
 $('.dside').scrollTop=ss;
 const mu=getComputedStyle(document.body).getPropertyValue('--mu'),sel=S.m=='ytd'?-1:cm,ds=[{type:DT,label:l,data:vals.map(v=>v===null?null:+v.toFixed(2)),borderColor:'#2e9e5b',borderWidth:3,tension:.35,pointRadius:vals.map((_,j)=>j==sel?7:4),pointBackgroundColor:'#2e9e5b',fill:DT=='line',backgroundColor:DT=='bar'?vals.map((_,j)=>j==sel?'#14532d':'#7fd4a0'):'rgba(46,158,91,.14)',borderRadius:8,order:2}];
 if(ok.length>1)ds.push({type:'line',label:'Average',data:vals.map(v=>v===null?null:+av.toFixed(2)),borderColor:'#f0a35e',borderDash:[6,4],borderWidth:2,pointRadius:0,order:1});
 mk('dc',{type:'bar',data:{labels:MN,datasets:ds},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:mu,boxWidth:12}},tooltip:{callbacks:{label:c=>c.dataset.label+': '+f(c.parsed.y)}}},scales:{x:{ticks:{color:mu},grid:{display:false}},y:{beginAtZero:true,ticks:{color:mu,callback:v=>f(v)},grid:{color:'rgba(120,160,135,.15)'}}}}});
}
$('#dv').onclick=e=>{const T=e.target,q=s=>T.closest(s);let x;
 if(q('#dx'))return closeDet();
 if(x=q('[data-j]'))DI=+x.dataset.j;
 else if(x=q('[data-nav]'))DI=(DI+ +x.dataset.nav+TR.length)%TR.length;
 else if(x=q('[data-ty]'))DT=x.dataset.ty;
 else if(x=q('[data-mm]')){const v=x.dataset.mm;S.m=v=='ytd'?'ytd':+v;render()}
 else if(x=q('.ck')){if(x.dataset.by=='co'){S.co=x.dataset.n;S.dept='All'}else S.dept=x.dataset.n;S.sec='All';render()}
 else if(q('[data-reset]')){S.co='All';S.dept='All';S.sec='All';render()}
 else return;
 drawDet()};
$('#app').onclick=e=>{const c=e.target.closest('[data-i]');if(c)return openDet(+c.dataset.i);const k=e.target.closest('[data-k]');if(k)openDet(TR.findIndex(x=>x[0]==k.dataset.k))};
document.addEventListener('keydown',e=>{const on=$('#dv').classList.contains('on');
 if(on&&e.key=='Escape')closeDet();else if(on&&e.key=='ArrowRight'){DI=(DI+1)%TR.length;drawDet()}else if(on&&e.key=='ArrowLeft'){DI=(DI-1+TR.length)%TR.length;drawDet()}
 else if(e.key=='Enter'&&e.target.dataset?.i!==undefined)openDet(+e.target.dataset.i)});
load();
</script></body></html>
