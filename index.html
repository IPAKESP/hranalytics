.k{position:relative}.k .ic{position:absolute;top:12px;right:12px}.k .l{padding-right:36px}.k:hover .ic,.tc:hover .ic{transform:rotate(-10deg) scale(1.12)}.k.hero .ic{background:rgba(255,255,255,.22);color:#fff}.ds.on .ic{background:rgba(255,255,255,.22);color:#fff}.dh h2 .ic{width:34px;height:34px;vertical-align:middle}.dh h2 .ic svg{width:20px;height:20px}
