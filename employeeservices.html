<script>
/* ===== DATA SOURCE =====
   Published link of the sheet "Admin Employee service".
   For the most reliable result paste the gid of each tab below (open the tab in Google Sheets, the URL shows ...#gid=123456).
   Publish ONLY the Submissions and AreaScores tabs (File > Share > Publish to web > choose the tab, format CSV).
   If a gid is left empty the page reads that tab by name through the sheet's normal "anyone with the link can view" access. */
const PUB='https://docs.google.com/spreadsheets/d/e/2PACX-1vR_G6_fg9cUKFAoV8BfJGpTKLLmFoFKVph2XtAaKW03cwAjzsZnmNIjFdAUKeoPWOPogdOdC-s1vvKw/pub';

const GID={sub:'265262700',area:'1481590677'};
const TARGET=95;                         // achieved score >= 95 = green, below = red
const ORDER=['mess','transport','housekeeping'];
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],$=s=>document.querySelector(s);
const PAL=['#2e9e5b','#f0a35e','#14532d','#6cc78f','#4a8fd4','#a7e3bd'];
const pad=n=>String(n).padStart(2,'0'),fP=v=>v==null?'–':v.toFixed(1)+'%',fN=v=>Math.round(v).toLocaleString('en-US');
const okc=v=>v>=TARGET?'#2e9e5b':'#d4543a',esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const avg=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:null;
const IC={target:'M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3c-.46-4.17-3.77-7.48-7.94-7.94V1h-2v2.06C6.83 3.52 3.52 6.83 3.06 11H1v2h2.06c.46 4.17 3.77 7.48 7.94 7.94V23h2v-2.06c4.17-.46 7.48-3.77 7.94-7.94H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z',
check:'M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z',
block:'M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zM4 12c0-4.42 3.58-8 8-8 1.85 0 3.55.63 4.9 1.69L5.69 16.9C4.63 15.55 4 13.85 4 12zm8 8c-1.85 0-3.55-.63-4.9-1.69L18.31 7.1C19.37 8.45 20 10.15 20 12c0 4.42-3.58 8-8 8z',
cal:'M20 3h-1V1h-2v2H7V1H5v2H4c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 18H4V8h16v13z',
doc:'M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z',
trend:'M16 6l2.29 2.29-4.88 4.88-4-4L2 16.59 3.41 18l6-6 4 4 6.3-6.29L22 12V6z',
food:'M11 9H9V2H7v7H5V2H3v7c0 2.12 1.66 3.84 3.75 3.97V22h2.5v-9.03C11.34 12.84 13 11.12 13 9V2h-2v7zm5-3v8h2.5v8H21V2c-2.76 0-5 2.24-5 4z',
home:'M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z',
bus:'M4 16c0 .88.39 1.67 1 2.22V20a1 1 0 0 0 1 1h1a1 1 0 0 0 1-1v-1h8v1a1 1 0 0 0 1 1h1a1 1 0 0 0 1-1v-1.78c.61-.55 1-1.34 1-2.22V6c0-3.5-3.58-4-8-4s-8 .5-8 4v10zm3.5 1a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm9 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zM6 11V6h12v5H6z'};
const I=n=>`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${IC[n]||IC.doc}"/></svg>`;
const pIc=k=>/transport/.test(k)?'bus':/house/.test(k)?'home':/mess/.test(k)?'food':'doc';

let SKIP={},SUB=[],AREA=[],S={co:'All',y:0,rd:'All',m:'latest',dt:'All'},CH={},CUR={},DI=0,PTS=[];

/* ---------- CSV ---------- */
function parseCSV(t){const r=[];let row=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}else if(c=='"')q=true;else if(c==','){row.push(f);f=''}else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;row.push(f);r.push(row);row=[];f=''}else f+=c}if(f!==''||row.length){row.push(f);r.push(row)}return r}
const rows=text=>{const t=parseCSV(text);if(!t.length)return[];const h=t[0].map(s=>s.trim().toLowerCase().replace(/[^a-z0-9]/g,''));return t.slice(1).filter(r=>r.length>3).map(r=>{const o={};h.forEach((k,i)=>o[k]=(r[i]??'').trim());return o})};
function pd(o){const s=o.date||o.timestamp||'';let m=s.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return{y:+m[1],m:+m[2]-1,d:+m[3]};
 m=s.match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/);if(m){const a=+m[1],b=+m[2];return b>12?{y:+m[3],m:a-1,d:b}:{y:+m[3],m:b-1,d:a}}const t=new Date(s);return isNaN(t)?null:{y:t.getFullYear(),m:t.getMonth(),d:t.getDate()}}
const dstr=p=>p.y+'-'+pad(p.m+1)+'-'+pad(p.d);
function ingest(sub,area){
 SKIP={};const sk=(o,why)=>{const k=(o.point||'(point khali)')+' – '+why;SKIP[k]=(SKIP[k]||0)+1;return null};
 SUB=rows(sub).map(o=>{const p=pd(o),sc=parseFloat(String(o.scorepct).replace('%',''));if(!o.point)return sk(o,'point khali');if(!p)return sk(o,'date samajh nahi aayi');if(isNaN(sc))return sk(o,'scorePct khali/galat');
  return{id:o.submissionid,co:(o.company||'').toUpperCase(),point:o.point,pk:o.point.toLowerCase(),round:o.round||'',sc,y:p.y,m:p.m,day:dstr(p)}}).filter(Boolean);
 AREA=rows(area||'').map(o=>{const p=pd(o);if(!p||!o.point||!o.area)return null;return{co:(o.company||'').toUpperCase(),pk:o.point.toLowerCase(),round:o.round||'',area:o.area,y:p.y,m:p.m,day:dstr(p),yes:+o.yes||0,part:+o.partially||0,no:+o.no||0}}).filter(Boolean);
 if(!SUB.length)throw new Error('Submissions tab mein koi valid row (date, point, scorePct) nahi mili.');
 const seen={};SUB.forEach(r=>{if(!seen[r.pk])seen[r.pk]=r.point});
 PTS=Object.keys(seen).sort((a,b)=>{const x=ORDER.indexOf(a),y=ORDER.indexOf(b);return (x<0?99:x)-(y<0?99:y)||a.localeCompare(b)}).map(k=>({k,t:seen[k]}));
 S.y=defY();
}
function defY(){const ys=SUB.map(r=>r.y),cy=new Date().getFullYear();return ys.includes(cy)?cy:Math.max(...ys)}

/* ---------- filters / stats ---------- */
const base=(o={})=>{const s={...S,...o};return SUB.filter(r=>r.y==s.y&&(s.co=='All'||r.co==s.co)&&(s.rd=='All'||r.round==s.rd))};
const monthRows=rs=>{const x=S.m=='ytd'?rs:rs.filter(r=>r.m==CUR.cm);return S.dt=='All'?x:x.filter(r=>r.day==S.dt)};
const sel=(o={})=>monthRows(base(o));
function series(rs){const dm={};rs.forEach(r=>(dm[r.day]??=[]).push(r.sc));let days;
 if(S.m=='ytd')days=Object.keys(dm).sort();else{const n=new Date(S.y,CUR.cm+1,0).getDate();days=Array.from({length:n},(_,i)=>S.y+'-'+pad(CUR.cm+1)+'-'+pad(i+1))}
 return{days,labels:days.map(d=>S.m=='ytd'?(+d.slice(8))+' '+MN[+d.slice(5,7)-1]:+d.slice(8)),vals:days.map(d=>dm[d]?avg(dm[d]):null),ns:days.map(d=>dm[d]?dm[d].length:0)}}
function stat(rs){const s=series(rs),v=s.vals.filter(x=>x!=null);
 return{n:rs.length,a:avg(rs.map(r=>r.sc)),s,dn:v.length,below:v.filter(x=>x<TARGET).length,best:v.length?Math.max(...v):null,worst:v.length?Math.min(...v):null}}
function areaStats(pk,o={}){const s={...S,...o},m={};
 AREA.filter(r=>r.pk==pk&&r.y==s.y&&(s.co=='All'||r.co==s.co)&&(s.rd=='All'||r.round==s.rd)&&(S.m=='ytd'||r.m==CUR.cm)&&(S.dt=='All'||r.day==S.dt)).forEach(r=>{const a=m[r.area]??={y:0,p:0,n:0};a.y+=r.yes;a.p+=r.part;a.n+=r.no});
 return Object.entries(m).map(([k,a])=>{const t=a.y+a.p+a.n;return{k,v:t?(a.y+a.p*.5)/t*100:null,n:t}}).filter(x=>x.v!=null).sort((x,y)=>x.v-y.v)}
const pill=v=>v==null?'–':`<span class="pill ${v>=TARGET?'l':'h'}">${fP(v)}</span>`;
const cls=v=>v==null?'':v>=TARGET?'g':'b';
const bl=(arr,lim)=>{const A=lim?arr.slice(0,lim):arr;return A.length?A.map(x=>`<div class="bl" title="${esc(x.k)}: ${fP(x.v)}"><span class="bn">${esc(x.k)}</span><div class="bt"><i style="width:${Math.max(2,Math.min(100,x.v))}%;background:${okc(x.v)}"></i></div><b style="color:${okc(x.v)}">${fP(x.v)}</b></div>`).join(''):'<div class="msg" style="padding:14px">Is selection ke liye data nahi hai</div>'};

/* ---------- ui ---------- */
const uniq=a=>[...new Set(a)].sort();
function fill(id,vals,cur,all){$(id).innerHTML=(all?'<option>All</option>':'')+vals.map(v=>`<option ${v==cur?'selected':''}>${v}</option>`).join('')}
function filters(){fill('#fc',uniq(SUB.map(r=>r.co)),S.co,1);fill('#fy',uniq(SUB.map(r=>r.y)),S.y);fill('#fr',uniq(SUB.map(r=>r.round).filter(Boolean)),S.rd,1)}
function months(av){$('#mm').innerHTML='<span class="mlab">Month</span>'+MN.map((m,i)=>`<button class="mp ${av.has(i)?'':'no'} ${S.m!='ytd'&&i==CUR.cm?'on':''}" data-m="${i}">${m}</button>`).join('')+`<button class="mp ${S.m=='ytd'?'on':''}" data-m="ytd">Full year</button>`}
function mk(id,cfg){if(CH[id])CH[id].destroy();const e=document.getElementById(id);if(e)CH[id]=new Chart(e,cfg)}
function destroy(){Object.keys(CH).forEach(k=>{try{CH[k].destroy()}catch(e){}delete CH[k]})}
function dailyCfg(st,name,big){const s=st.s,v=s.vals.filter(x=>x!=null),mn=(!big&&CUR.ymin!=null)?CUR.ymin:Math.max(0,Math.floor((Math.min(...v,TARGET)-5)/5)*5),mu=getComputedStyle(document.body).getPropertyValue('--mu');
 return{type:'bar',data:{labels:s.labels,datasets:[{label:name,data:s.vals,backgroundColor:s.vals.map(x=>x==null?'transparent':okc(x)),borderRadius:4,order:2},{type:'line',label:'Target '+TARGET+'%',data:s.labels.map(()=>TARGET),borderColor:'#14532d',borderDash:[6,4],borderWidth:1.5,pointRadius:0,order:1}]},
 options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{display:false},tooltip:{callbacks:{title:i=>s.days[i[0].dataIndex],label:c=>c.datasetIndex==0?(c.parsed.y==null?'No submission':'SLA: '+fP(c.parsed.y)+' ('+s.ns[c.dataIndex]+' submission'+(s.ns[c.dataIndex]>1?'s':'')+')'):c.dataset.label}}},
 scales:{x:{ticks:{color:mu,maxRotation:0,minRotation:0,autoSkip:S.m=='ytd',maxTicksLimit:S.m=='ytd'?(big?40:16):40,font:{size:big?11:9},padding:4},grid:{display:false}},y:{min:mn,max:100,ticks:{color:mu,callback:v=>v+'%'},grid:{color:'rgba(120,160,135,.15)'}}}}}}

function render(){
 destroy();filters();
 const b=base(),av=new Set(b.map(r=>r.m));const nm=new Date().getMonth();CUR.cm=S.m=='latest'?(av.has(nm)?nm:av.size?Math.max(...av):nm):S.m=='ytd'?(av.size?Math.max(...av):0):+S.m;months(av);
 if(S.dt!='All'&&S.m!='ytd'&&+S.dt.slice(5,7)-1!=CUR.cm)S.dt='All';$('#fd').value=S.dt=='All'?'':S.dt;
 const per=S.dt!='All'?S.dt:S.m=='ytd'?'Jan–Dec '+S.y:MN[CUR.cm]+' '+S.y,rs=monthRows(b),scope=(S.co=='All'?'All companies':S.co)+(S.rd!='All'?' · '+S.rd:'');CUR.per=per;CUR.scope=scope;
 if(!rs.length){$('#app').innerHTML=`<div class="msg"><b>${per} ke liye abhi koi submission nahi.</b><br>Koi aur month ya date chunein, ya data aane ke baad page reload karein.</div>`;return}
 const all=stat(rs),ps=PTS.map(p=>({...p,st:stat(rs.filter(r=>r.pk==p.k))}));CUR.ps=ps;
 const when=p=>{const m=uniq(base().filter(r=>r.pk==p.k).map(r=>r.m)).map(i=>MN[i]).join(', ');return m?'Data in: '+m:'Is year/filter mein koi row nahi'};
 const kp=[`<div class="k hero ${all.a>=TARGET?'':'bd2'}" style="--i:0"><i class="ic">${I('target')}</i><div class="l">Overall achieved SLA</div><div class="v">${fP(all.a)}</div><div class="d">Target ${TARGET}% · ${all.a>=TARGET?'▲ '+(all.a-TARGET).toFixed(1)+' pts above':'▼ '+(TARGET-all.a).toFixed(1)+' pts below'}</div></div>`]
  .concat(ps.map((p,i)=>`<div class="k cl" data-d="${i}" style="--i:${i+1}"><i class="ic">${I(pIc(p.k))}</i><div class="l">${esc(p.t)} SLA</div><div class="v ${cls(p.st.a)}">${fP(p.st.a)}</div><div class="d">${p.st.n} submissions · ${p.st.below} day${p.st.below==1?'':'s'} below</div></div>`))
  .concat([`<div class="k" style="--i:${ps.length+1}"><i class="ic">${I('doc')}</i><div class="l">Submissions</div><div class="v">${fN(all.n)}</div><div class="d">${all.dn} day${all.dn==1?'':'s'} with data</div></div>`,
  `<div class="k" style="--i:${ps.length+2}"><i class="ic">${I('block')}</i><div class="l">Days below target</div><div class="v ${all.below?'b':'g'}">${all.below}</div><div class="d">All forms combined, daily avg</div></div>`,
  `<div class="k" style="--i:${ps.length+3}"><i class="ic">${I('trend')}</i><div class="l">Best / worst day</div><div class="v" style="font-size:17px">${fP(all.best)} / ${fP(all.worst)}</div><div class="d">Daily average of all forms</div></div>`]).join('');
 $('#app').innerHTML=`<h2>Overview <small>${per} · ${scope} · achieved SLA = average of submission scores</small></h2><div class="kg">${kp}</div>
 <h2>Daily SLA trend <small>${per} · <span class="leg"><span><i style="background:#2e9e5b"></i>≥ ${TARGET}% achieved</span><span><i style="background:#d4543a"></i>below ${TARGET}%</span><span>– – target</span></span></small></h2>
 <div class="tg" style="--n:${Math.min(ps.length,3)}">${ps.map((p,i)=>`<div class="c cl" data-d="${i}" style="--i:${i}"><div class="ct"><i class="ic">${I(pIc(p.k))}</i><b>${esc(p.t)}</b>${pill(p.st.a)}<small>${p.st.n?p.st.n+' submissions · '+p.st.below+' day'+(p.st.below==1?'':'s')+' below':'No data in '+per+' · '+when(p)}</small></div><div class="cv sm"><canvas id="p${i}"></canvas></div><div class="hint">Area detail ›</div></div>`).join('')}</div>
 <h2>Area SLA <small>${per} · lowest areas first · line = ${TARGET}% target</small></h2>
 <div class="g3" style="--n:${Math.min(ps.length,3)}">${ps.map((p,i)=>{const ar=areaStats(p.k);return `<div class="c cl" data-d="${i}" style="--i:${i}"><div class="ct"><i class="ic">${I(pIc(p.k))}</i><b>${esc(p.t)}</b>${pill(p.st.a)}</div>${AREA.length?bl(ar,8):'<div class="msg" style="padding:14px">AreaScores tab load nahi hui</div>'}${ar.length>8?`<div class="hint">All ${ar.length} areas ›</div>`:'<div class="hint">Detail ›</div>'}</div>`}).join('')}</div>`;
 const vs=ps.flatMap(p=>p.st.s.vals.filter(x=>x!=null));CUR.ymin=vs.length?Math.max(0,Math.floor((Math.min(...vs,TARGET)-5)/5)*5):null;
 ps.forEach((p,i)=>mk('p'+i,dailyCfg(p.st,p.t+' daily SLA')));
}

/* ---------- detail overlay ---------- */
function openDet(i){DI=(i+CUR.ps.length)%CUR.ps.length;$('#dv').classList.add('on');document.body.style.overflow='hidden';drawDet()}
function closeDet(){$('#dv').classList.remove('on');document.body.style.overflow='';if(CH.dc){CH.dc.destroy();delete CH.dc}}
function drawDet(){
 const p=CUR.ps[DI],{per,scope}=CUR,rs=sel().filter(r=>r.pk==p.k),st=stat(rs),s=st.s;
 const byCo=uniq(sel({co:'All'}).filter(r=>r.pk==p.k).map(r=>r.co)).map(c=>({k:c,v:avg(sel({co:'All'}).filter(r=>r.pk==p.k&&r.co==c).map(r=>r.sc))})).filter(x=>x.v!=null);
 const byRd=uniq(sel({rd:'All'}).filter(r=>r.pk==p.k).map(r=>r.round)).map(c=>({k:c||'–',v:avg(sel({rd:'All'}).filter(r=>r.pk==p.k&&r.round==c).map(r=>r.sc))})).filter(x=>x.v!=null);
 const d=st.a-TARGET,ar=areaStats(p.k);
 const stats=[['Achieved SLA',fP(st.a),cls(st.a)=='g'?'ug':cls(st.a)=='b'?'ub':''],['Vs target '+TARGET+'%',st.a==null?'–':(d>=0?'▲ ':'▼ ')+Math.abs(d).toFixed(1)+' pts',d>=0?'ug':'ub'],['Submissions',fN(st.n),''],['Days with data',st.dn,''],['Days below target',st.below,st.below?'ub':'ug'],['Best day',fP(st.best),''],['Worst day',fP(st.worst),st.worst!=null&&st.worst<TARGET?'ub':'']];
 const trs=s.days.map((dy,j)=>s.vals[j]==null?'':`<tr><td>${dy}</td><td>${s.ns[j]}</td><td>${fP(s.vals[j])}</td><td>${pill(s.vals[j])}</td></tr>`).filter(Boolean).reverse().join('');
 if(CH.dc){CH.dc.destroy();delete CH.dc}
 const sc=$('.dside')?.scrollTop||0;
 $('#dv').innerHTML=`<div class="dside">${CUR.ps.map((q,j)=>`<button class="ds ${j==DI?'on':''}" data-j="${j}"><span><i class="ic">${I(pIc(q.k))}</i>${esc(q.t)}</span><b>${fP(q.st.a)}</b></button>`).join('')}</div>
 <div class="dmain"><div class="dh"><button class="btn" data-nav="-1" aria-label="Previous">◀</button><div><div class="sub">Form ${DI+1} of ${CUR.ps.length} · ${per} · ${scope}</div><h2><i class="ic">${I(pIc(p.k))}</i> ${esc(p.t)}</h2></div><button class="btn" data-nav="1" aria-label="Next">▶</button><span class="sp"></span><button class="btn" id="dx">Close ✕</button></div>
 <div class="sg">${stats.map(x=>`<div><small>${x[0]}</small><b class="${x[2]}">${x[1]}</b></div>`).join('')}</div>
 <div class="c"><div class="cv big"><canvas id="dc"></canvas></div></div>
 <div class="g2b"><div><h3>Area SLA <small class="sub">· ${ar.length} areas, lowest first</small></h3>${AREA.length?bl(ar):'<div class="msg">AreaScores tab load nahi hui</div>'}</div>
 <div><h3>By company</h3>${bl(byCo)}<h3>By round</h3>${bl(byRd)}</div></div>
 <h3>Day by day</h3><div class="tw"><table><thead><tr><th>Date</th><th>Submissions</th><th>Daily SLA</th><th>Status</th></tr></thead><tbody>${trs||'<tr><td colspan="4">No data</td></tr>'}</tbody></table></div></div>`;
 $('.dside').scrollTop=sc;mk('dc',dailyCfg(st,p.t+' daily SLA',true));
}
$('#dv').onclick=e=>{const T=e.target,q=s=>T.closest(s);let x;if(q('#dx'))return closeDet();
 if(x=q('[data-j]'))DI=+x.dataset.j;else if(x=q('[data-nav]'))DI=(DI+ +x.dataset.nav+CUR.ps.length)%CUR.ps.length;else return;drawDet()};
$('#app').onclick=e=>{const c=e.target.closest('[data-d]');if(c)openDet(+c.dataset.d)};
document.addEventListener('keydown',e=>{const on=$('#dv').classList.contains('on');if(!on)return;
 if(e.key=='Escape')closeDet();else if(e.key=='ArrowRight'){DI=(DI+1)%CUR.ps.length;drawDet()}else if(e.key=='ArrowLeft'){DI=(DI-1+CUR.ps.length)%CUR.ps.length;drawDet()}});

/* ---------- events ---------- */
$('#fc').onchange=e=>{S.co=e.target.value;render()};$('#fy').onchange=e=>{S.y=+e.target.value;render()};$('#fr').onchange=e=>{S.rd=e.target.value;render()};
$('#fd').onchange=e=>{const v=e.target.value;if(!v)S.dt='All';else{S.dt=v;S.y=+v.slice(0,4);S.m=+v.slice(5,7)-1}render()};
$('#fx').onclick=()=>{S.dt='All';render()};
$('#rs').onclick=()=>{S={co:'All',y:defY(),rd:'All',m:'latest',dt:'All'};render()};
$('#mm').onclick=e=>{const b=e.target.closest('[data-m]');if(!b||b.classList.contains('no'))return;const m=b.dataset.m;S.m=m=='ytd'?'ytd':+m;S.dt='All';render()};

/* ---------- load ---------- */
/* Sources are tried in order until one returns the right columns:
   1) published CSV of that tab (gid)  2) whole-document publish as XLSX (all tabs, read with SheetJS)  3) gviz by tab name.
   A "whole document" publish link (...pub?output=csv, no gid) only returns the FIRST tab, so it is validated and skipped if the columns do not match. */
const NEED={Submissions:['scorepct','point'],AreaScores:['area','point']};
const okCSV=(t,name)=>{if(!t||/^\s*<(!DOCTYPE|html)/i.test(t))return false;const h=(parseCSV(t.slice(0,3000))[0]||[]).map(s=>s.trim().toLowerCase().replace(/[^a-z0-9]/g,''));return NEED[name].every(k=>h.includes(k))};
const fetchText=async u=>{const r=await fetch(u);if(!r.ok)throw new Error('HTTP '+r.status);return r.text()};
let WB=null;
function loadXlsx(){return WB||(WB=(async()=>{if(!window.XLSX)await new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';s.onload=ok;s.onerror=()=>no(new Error('SheetJS load nahi hua'));document.head.appendChild(s)});
 const r=await fetch(PUB+'?output=xlsx&t='+Date.now());if(!r.ok)throw new Error('xlsx HTTP '+r.status);return XLSX.read(await r.arrayBuffer(),{type:'array',cellDates:true})})())}
async function get(name,gid){const t=Date.now(),errs=[];
 const tries=[];if(gid)tries.push(()=>fetchText(`${PUB}?gid=${gid}&single=true&output=csv&t=${t}`));
 tries.push(async()=>{const wb=await loadXlsx(),k=name.toLowerCase().slice(0,-1),sn=wb.SheetNames.find(n=>n.toLowerCase().replace(/[^a-z]/g,'').includes(k.replace(/[^a-z]/g,'')));if(!sn)throw new Error('tab "'+name+'" nahi mili (tabs: '+wb.SheetNames.join(', ')+')');return XLSX.utils.sheet_to_csv(wb.Sheets[sn],{dateNF:'yyyy-mm-dd',rawNumbers:false})});
 tries.push(()=>fetchText(`https://docs.google.com/spreadsheets/d/${DOC}/gviz/tq?tqx=out:csv&sheet=${name}&t=${t}`));
 for(const f of tries){try{const x=await f();if(okCSV(x,name))return x;errs.push('galat tab / columns')}catch(e){errs.push(e.message)}}
 throw new Error(name+': load nahi hua ('+errs.join(' | ')+')')}
async function load(){$('#st').textContent='Loading data…';$('#er').style.display='none';$('#wn').style.display='none';
 try{const [sub,area]=await Promise.all([get('Submissions',GID.sub),get('AreaScores',GID.area).catch(e=>{$('#wn').style.display='block';$('#wn').textContent='Area scores load nahi huay ('+e.message+'). Daily charts chal rahe hain, area detail khali rahegi.';return ''})]);
  ingest(sub,area);const cnt={};SUB.forEach(r=>cnt[r.point]=(cnt[r.point]||0)+1);
  $('#st').textContent='Live from Google Sheet · updated '+new Date().toLocaleTimeString()+' · Forms: '+Object.entries(cnt).map(([k,v])=>k+' ('+v+')').join(', ');
  const sks=Object.entries(SKIP);if(sks.length){const w=$('#wn');w.style.display='block';w.innerHTML='<b>Kuch rows skip hui:</b> '+sks.map(([k,v])=>esc(k)+' × '+v).join(' · ')}
  render()}
 catch(e){console.error(e);$('#st').textContent='Could not load live data';const x=$('#er');x.style.display='block';
  x.innerHTML='Data load nahi hua: <b>'+esc(e.message)+'</b><br>1) Publish to web mein <b>Entire document</b> ke bajaye har tab alag chunein (<code>Submissions</code> aur <code>AreaScores</code>) aur format <b>CSV</b> rakhein, ya Entire document ko <b>Microsoft Excel (.xlsx)</b> mein publish karein.<br>2) Page ko website ya local server se kholein (file:// se fetch block ho sakta hai).'}
}
(function(){const h=document.querySelector('header'),u=()=>document.documentElement.style.setProperty('--hh',h.offsetHeight+'px');u();addEventListener('resize',u);if(window.ResizeObserver)new ResizeObserver(u).observe(h)})();
load();
</script></body></html>
