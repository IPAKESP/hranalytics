 <h2>Breakdown<small>${per}</small></h2>
 <div class="g2"><div class="c"><div class="t"><span>General store expense by company</span></div><div class="cv big"><canvas id="c1"></canvas></div></div><div class="c"><div class="t"><span>Mess cost composition (group)</span></div><div class="cv big"><canvas id="c2"></canvas></div></div></div>

 const mu='#5b7a66',gr='rgba(120,160,135,.15)',ax={ticks:{color:mu},grid:{color:gr}};
 KP.forEach(([k,l,f],i)=>{const d=tr.map(x=>x?+x[k].toFixed(2):null),ln=LINE.includes(k);mk('t'+i,{type:ln?'line':'bar',data:{labels:MN,datasets:[{data:d,borderColor:'#2e9e5b',borderWidth:2.5,tension:.35,pointRadius:3,fill:ln,backgroundColor:ln?'rgba(46,158,91,.12)':d.map((_,j)=>!ytd&&j==cm?'#14532d':'#7fd4a0'),borderRadius:4}]},options:{plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>l+': '+f(c.parsed.y)}}},scales:{x:{ticks:{color:mu,font:{size:9},maxRotation:0,autoSkip:false},grid:{display:false}},y:{beginAtZero:true,ticks:{color:mu,font:{size:10},maxTicksLimit:4},grid:{color:gr}}}}})});
 const ca=COS.map(c=>agg(rs,c)||{groc:0,gh:0,ref:0,kar:0}),P=['#14532d','#2e9e5b','#6cc78f','#c9f0d6'];

 const ga=agg(rs,'All'),cp=[['Grocery','groc'],['Veg & fruits','veg'],['Meat','meat'],['Water (mess)','wat'],['Staff payroll','pay']];
 mk('c2',{type:'doughnut',data:{labels:cp.map(x=>x[0]),datasets:[{data:cp.map(x=>ga[x[1]]),backgroundColor:['#2e9e5b','#6cc78f','#14532d','#a7e3bd','#1f7a45'],borderWidth:0}]},options:{cutout:'60%',plugins:{legend:{position:'bottom',labels:{color:mu,boxWidth:10}},tooltip:{callbacks:{label:c=>{const t=c.dataset.data.reduce((p,z)=>p+z,0);return c.label+': '+fN(c.parsed)+' ('+(c.parsed/t*100).toFixed(1)+'%)'}}}}}});
 const gv=k=>trG.map(x=>x?Math.round(x[k]):null);
 mk('c3',{data:{labels:MN,datasets:[{type:'bar',label:'Total mess cost',data:gv('tm'),backgroundColor:'#a7e3bd',borderRadius:4},{type:'line',label:'Recovered',data:gv('rec'),borderColor:'#f0a35e',tension:.35},{type:'line',label:'Net to company',data:gv('net'),borderColor:'#14532d',tension:.35}]},options:{interaction:{mode:'index',intersect:false},scales:{x:{...ax,grid:{display:false}},y:{...ax,beginAtZero:true,ticks:{color:mu,callback:v=>fC(v)}}},plugins:{legend:{labels:{color:mu,boxWidth:12}},tooltip:{callbacks:{label:c=>c.dataset.label+': '+fN(c.parsed.y)}}}}});
 mk('c4',{type:'bar',data:{labels:MN,datasets:[['Permanent','mP','#14532d'],['Third party','mT','#2e9e5b'],['Guests / cash / contractor','mO','#a7e3bd']].map(([n,k,c])=>({label:n,data:trG.map(x=>x?x[k]:null),backgroundColor:c}))},options:{interaction:{mode:'index',intersect:false},scales:{x:{...ax,stacked:true,grid:{display:false}},y:{...ax,stacked:true,ticks:{color:mu,callback:v=>fC(v)}}},plugins:{legend:{labels:{color:mu,boxWidth:12}}}}});

 const C2=[['gs','Store exp.'],['mat','Mess material'],['pay','Payroll'],['tm','Total mess'],['rec','Recovered'],['net','Net cost'],['meals','Meals'],['cpm','Cost/meal'],['ncpm','Net/meal']];

/* detail view */
let DI=0,DT='bar';
function det(){const [k,l,f,u,ic,g]=KP[DI],{tr,cm,rs,per,cn}=CUR,vals=tr.map(x=>x?x[k]:null),ok=vals.map((v,i)=>v===null?-1:i).filter(i=>i>=0);
 const av=ok.reduce((s,i)=>s+vals[i],0)/(ok.length||1),mx=ok.reduce((p,i)=>vals[i]>vals[p]?i:p,ok[0]),mn=ok.reduce((p,i)=>vals[i]<vals[p]?i:p,ok[0]),pi=ok.filter(i=>i<cm).pop(),dl=vals[cm]!=null&&pi!=null?vals[cm]-vals[pi]:null;
 const dc=d=>d==null||!u||Math.abs(d)<1e-9?'':((d>0)==(u>0)?'g':'b'),dt=d=>d==null?'–':Math.abs(d)<1e-9?'No change':(d>0?'▲ ':'▼ ')+f(Math.abs(d));
 const st=[[MN[cm]+' '+S.y,vals[cm]!=null?f(vals[cm]):'–',''],['Change vs previous month',dt(dl),dc(dl)],['Monthly average',f(av),''],['Highest',f(vals[mx])+' · '+MN[mx],''],['Lowest',f(vals[mn])+' · '+MN[mn],'']];
 if(SUMK.includes(k))st.push(['Year total',f(ok.reduce((s,i)=>s+vals[i],0)),'']);
 const sp=g?[]:COS.map(c=>[c,(agg(rs,c)||{})[k]||0]),m=Math.max(...sp.map(x=>x[1]),1);
 $('#dv').innerHTML=`<div class="dh"><button class="btn" data-n="-1">◀</button><div><div class="sub">${DI+1} of ${KP.length} · ${cn}${g?' (group-wide metric)':''}</div><h2>${I(ic)} ${l}</h2></div><button class="btn" data-n="1">▶</button><span class="sp"></span><button class="btn ${DT=='bar'?'on':''}" data-t="bar">Bars</button><button class="btn ${DT=='line'?'on':''}" data-t="line">Line</button><button class="btn p" id="dx">Close ✕</button></div>
 <div class="sg">${st.map(x=>`<div><small>${x[0]}</small><b class="${x[2]}">${x[1]}</b></div>`).join('')}</div><div class="c"><div class="cv big"><canvas id="dc"></canvas></div></div>
 <div class="g2"><div><h2>Month by month</h2><div class="tw"><table><thead><tr><th>Month</th><th>${l}</th><th>Change</th></tr></thead><tbody>${MN.map((mm,i)=>{const p=ok.filter(j=>j<i).pop(),d=vals[i]!=null&&p!=null?vals[i]-vals[p]:null;return`<tr><td>${mm}</td><td>${vals[i]!=null?f(vals[i]):'–'}</td><td class="${dc(d)}">${dt(d)}</td></tr>`}).join('')}</tbody></table></div></div>
 <div>${g?'':`<h2>By company · ${per}</h2>${sp.map(x=>`<div class="bl"><span>${x[0]}</span><div class="bt"><i style="width:${Math.max(2,x[1]/m*100)}%"></i></div><b>${f(x[1])}</b></div>`).join('')}`}</div></div>`;
 const mu='#5b7a66';mk('dc',{type:DT,data:{labels:MN,datasets:[{label:l,data:vals.map(v=>v===null?null:+v.toFixed(2)),borderColor:'#2e9e5b',borderWidth:3,tension:.35,pointRadius:4,fill:DT=='line',backgroundColor:DT=='bar'?vals.map((_,j)=>j==cm?'#14532d':'#7fd4a0'):'rgba(46,158,91,.14)',borderRadius:8}]},options:{plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>l+': '+f(c.parsed.y)}}},scales:{x:{ticks:{color:mu},grid:{display:false}},y:{beginAtZero:true,ticks:{color:mu,callback:v=>f(v)},grid:{color:'rgba(120,160,135,.15)'}}}}})}
function openDet(i){DI=(i+KP.length)%KP.length;$('#dv').classList.add('on');document.body.style.overflow='hidden';det()}
function closeDet(){$('#dv').classList.remove('on');document.body.style.overflow='';if(CH.dc){CH.dc.destroy();delete CH.dc}}
$('#dv').onclick=e=>{const T=e.target;if(T.closest('#dx'))return closeDet();const n=T.closest('[data-n]'),t=T.closest('[data-t]');if(n)DI=(DI+ +n.dataset.n+KP.length)%KP.length;else if(t)DT=t.dataset.t;else return;det()};
document.addEventListener('keydown',e=>{if(!$('#dv').classList.contains('on'))return;if(e.key=='Escape')closeDet();else if(e.key=='ArrowRight'){DI=(DI+1)%KP.length;det()}else if(e.key=='ArrowLeft'){DI=(DI-1+KP.length)%KP.length;det()}});
$('#app').onclick=e=>{const c=e.target.closest('[data-k],[data-i]'),r=e.target.closest('[data-mm]');if(r){S.m=+r.dataset.mm;render()}else if(c)openDet(+(c.dataset.k??c.dataset.i))};
