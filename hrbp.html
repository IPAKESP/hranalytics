<style>
:root{--bg:#eef4fd;--sf:#fff;--sf2:#f4f8fe;--bd:#d3e0f5;--tx:#0f2347;--mu:#5a6f94;--pr:#2563eb;--pd:#1e3a8a;--pl:#dbeafe;--ok:#1f8a4c;--bad:#d4543a;--warm:240,163,94;--hh:50px;--font:Figtree,"Segoe UI",system-ui,sans-serif;--tipbg:#1e3a8a;--tiptx:#fff;color-scheme:light}

*{box-sizing:border-box;margin:0}

.logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#2563eb,#93c5fd);display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px}
h1{font-size:16px}.sub{color:var(--mu);font-size:12px}.sp{flex:1}
.btn{border:1px solid var(--bd);background:var(--sf2);color:var(--tx);padding:6px 11px;border-radius:12px;font:600 12.5px var(--font);cursor:pointer;transition:transform .15s,border-color .2s}.btn:hover{border-color:var(--pr);transform:translateY(-1px)}.btn:active,.mp:active{transform:scale(.94)}
.nav{display:flex;gap:6px;flex-wrap:wrap}.nl{text-decoration:none;color:var(--tx);border:1px solid var(--bd);background:var(--sf2);padding:7px 15px;border-radius:99px;font:600 13px var(--font);transition:transform .15s,border-color .2s}.nl:hover{border-color:var(--pr);transform:translateY(-1px)}
.nl.on,.mp.on{background:var(--pr);border-color:var(--pr);color:#fff}[data-theme=dark] .nl.on,[data-theme=dark] .mp.on{color:#0b1220}
main{max-width:1500px;margin:0 auto;padding:12px 24px 60px}
.bar{position:sticky;top:calc(var(--hh) + 8px);z-index:15;background:rgba(255,255,255,.6);border:1px solid rgba(30,58,138,.10);border-radius:14px;padding:8px 12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 2px 10px rgba(30,58,138,.05);-webkit-backdrop-filter:blur(14px) saturate(160%);backdrop-filter:blur(14px) saturate(160%)}
[data-theme=dark] .bar{background:rgba(19,29,51,.6);border-color:rgba(255,255,255,.10)}
.bar .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.f{display:flex;align-items:center;gap:5px}.f label{font-size:11px;color:var(--mu);font-weight:600;white-space:nowrap}
select{border:1px solid var(--bd);background:var(--sf2);color:var(--tx);padding:5px 8px;border-radius:8px;font:500 12.5px var(--font);max-width:150px}
#mm{display:flex;flex:1;min-width:260px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;gap:6px;align-items:center;border-left:1px solid var(--bd);padding-left:10px;margin-left:4px}#mm::-webkit-scrollbar{display:none}
.mp{border:1px solid var(--bd);background:var(--sf2);color:var(--tx);padding:3px 10px;border-radius:99px;font:600 12px var(--font);cursor:pointer;white-space:nowrap;flex:none;transition:transform .15s,border-color .2s}.mp:hover{border-color:var(--pr);transform:translateY(-1px)}.mp.no{opacity:.5}.mp.no.on{opacity:1}
.mlab{font-size:11px;color:var(--mu);font-weight:600;white-space:nowrap;flex:none}
h2{font-size:16px;margin:14px 0 8px;display:flex;align-items:center;gap:10px}h2 small{font-weight:500;color:var(--mu);font-size:12px}
.kg{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;margin-top:10px}
.k,.c{background:var(--sf);border:1px solid var(--bd);border-radius:18px;box-shadow:0 1px 2px rgba(30,58,138,.06),0 6px 20px rgba(30,58,138,.05);transition:transform .28s cubic-bezier(.2,.8,.2,1),box-shadow .28s}
.k:hover,.c:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(37,99,235,.22)}.k:active,.c:active{transform:scale(.97)}
.k{position:relative;padding:6px 9px;border-radius:12px;cursor:pointer}
.k .l{color:var(--mu);font-size:10.5px;font-weight:600;padding-right:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k .v{font-size:16px;margin:1px 0 0}.k .d{font-size:10px;font-weight:600;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k .d.g{color:var(--ok)}.k .d.b{color:var(--bad)}
.k.hero{background:linear-gradient(135deg,#2563eb,#1e40af);border:0}.k.hero .l,.k.hero .d,.k.hero .v,.k.hero .d.g,.k.hero .d.b{color:#fff}
.ic{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--pl);color:var(--pr);flex:none;transition:transform .25s}.ic svg{width:17px;height:17px;fill:currentColor}
.ic.s{width:24px;height:24px;border-radius:7px;margin-right:7px}.ic.s svg{width:14px;height:14px}.tl{font-style:normal;display:flex;align-items:center}
.k .ic{position:absolute;top:6px;right:6px;width:18px;height:18px;border-radius:6px}.k .ic svg{width:11px;height:11px}.k.hero .ic{background:rgba(255,255,255,.22);color:#fff}
.k:hover .ic,.c:hover .ic{transform:rotate(-10deg) scale(1.12)}
.sl{display:block;width:100%;height:9px;margin-top:2px;color:var(--pr);overflow:visible}.sl polyline{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1}.sl circle{fill:currentColor}.k.hero .sl{color:#fff;opacity:.9}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.c{padding:12px}.c.w2{grid-column:span 2}
.c .t{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px;font:700 13px var(--font)}.c .t span{color:var(--pr);font-size:15px}
.cv{position:relative;height:140px}
.tw{overflow:auto;border:1px solid var(--bd);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:13px}th{background:var(--pl);color:var(--pd);padding:9px 12px;font:700 13px var(--font);text-align:right;white-space:nowrap;position:sticky;top:0}
th:first-child,td:first-child{text-align:left}td{padding:8px 12px;border-top:1px solid var(--bd);text-align:right}tr:hover td{background:var(--sf2)}td.hm{font-weight:700}
.ins{display:flex;gap:10px;margin-top:12px;overflow-x:auto;scrollbar-width:none}.ins::-webkit-scrollbar{display:none}.ins div{background:var(--pl);border-radius:12px;padding:9px 13px;font-size:12.5px;color:var(--pd);font-weight:600;white-space:nowrap;flex:none}
.msg{padding:30px;text-align:center;color:var(--mu);font-size:13px}
.warn{background:rgba(var(--warm),.18);border:1px solid rgba(var(--warm),.5);padding:10px 14px;border-radius:14px;margin-top:12px;font-size:12.5px;display:none}
.err{background:rgba(212,84,58,.14);color:var(--bad);padding:10px 14px;border-radius:14px;margin-top:12px;display:none;font-size:13px}
.bl{display:grid;grid-template-columns:120px 1fr 56px;gap:8px;align-items:center;padding:3px 0;font-size:12.5px}.bn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.bt{background:var(--pl);border-radius:99px;height:10px;overflow:hidden}.bt i{display:block;height:100%;background:linear-gradient(90deg,#93b4f5,#2563eb);border-radius:99px;animation:gr .7s}@keyframes gr{from{width:0}}.bl b{text-align:right}
.sk{height:90px;border-radius:14px;margin-top:10px;background:linear-gradient(90deg,var(--pl),var(--sf2),var(--pl));background-size:200% 100%;animation:sh 1.2s infinite linear}@keyframes sh{to{background-position:-200% 0}}
#tip{position:fixed;z-index:100;pointer-events:none;display:none;background:var(--tipbg);color:var(--tiptx);padding:7px 11px;border-radius:9px;font:600 12px/1.45 var(--font);box-shadow:0 8px 22px rgba(0,0,0,.28);max-width:300px;white-space:pre-line}
[data-tip]{cursor:default}.mp[data-tip]{cursor:pointer}
.sc1{max-height:140px;overflow:auto;padding-right:4px}.bl[data-fk]{cursor:pointer}.bl[data-fk]:hover .bn{color:var(--pr)}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.sr{border:1px solid var(--bd);background:var(--sf2);color:var(--tx);padding:5px 9px;border-radius:10px;font:500 12.5px var(--font);width:220px;max-width:100%}
table.sc{font-size:12.5px}.sc th{cursor:pointer;user-select:none;padding:7px 10px}.sc td{padding:5px 10px}.sc tbody tr{cursor:pointer}
.sc th.sa::after{content:' ▲';font-size:9px}.sc th.sd::after{content:' ▼';font-size:9px}
.sc tbody tr.sel td{background:var(--pl);font-weight:700}.sc tfoot td{position:sticky;bottom:0;background:var(--pl);color:var(--pd);font-weight:800;border-top:2px solid var(--bd)}
.st{display:inline-block;padding:1px 9px;border-radius:99px;font-size:11px;font-weight:700;white-space:nowrap}
.st.f{background:var(--pl);color:var(--pd)}.st.v{background:rgba(240,163,94,.28);color:#b45309}[data-theme=dark] .st.v{color:#f0a35e}.st.o{background:var(--sf2);color:var(--mu);border:1px solid var(--bd)}
table.pr th,table.pr td{text-align:left}table.pr tbody tr{cursor:default}.tools .seg2{display:flex;gap:6px;flex-wrap:wrap}.tools .grow{flex:1}
@media(max-width:900px){.c.w2{grid-column:auto}.g{grid-template-columns:1fr}main{padding:10px 14px}header{padding:8px 14px}.bar{position:static}#mm{flex-basis:100%;border-left:0;padding-left:0;margin:6px 0 0}}
@media(max-width:600px){.bl{grid-template-columns:100px 1fr 60px}}
@media(prefers-reduced-motion:no-preference){.k,.c{animation:up .45s backwards;animation-delay:calc(var(--i,0)*35ms)}@keyframes up{from{opacity:0;transform:translateY(12px)}}.sl polyline{animation:dr 1s .25s backwards ease-out}@keyframes dr{from{stroke-dashoffset:1}}}
@media print{body{background:#fff}.bar,.nav{display:none}}
</style></head><body>
<header><img class="logo" src="logo.png" alt="Logo" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'logo',textContent:'HR'}))"><div><h1>HRBP Dashboard</h1><div class="sub" id="st">Loading data…</div></div><div class="sp"></div>
<nav class="nav"><a class="nl" href="index.html">Home</a><a class="nl on" href="hrbp.html">HRBP</a><a class="nl" href="admin.html">Admin</a><a class="nl" href="cost-analysis.html">Cost Analysis</a></nav></header>
<main>
<div class="err" id="er"></div><div class="warn" id="dm"></div>
<div class="bar"><div class="row"><div class="f"><label>Company</label><select id="fc"></select></div><div class="f"><label>Geo</label><select id="fg"></select></div><div class="f"><label>Department</label><select id="fd"></select></div><div class="f"><label>Section</label><select id="fs"></select></div><div class="f"><label>Year</label><select id="fy"></select></div><button class="btn" id="rs">Reset</button><div id="mm"></div></div></div>
<div class="sub" style="margin:8px 4px 0">Positions &amp; org chart show the current snapshot. Year and Month apply to Hiring and Attrition. Click a department bar to filter by it.</div>
<div id="app"><div class="sk"></div><div class="sk" style="height:220px"></div><div class="sk" style="height:220px"></div></div>
</main>
<script>
/* ============ CONFIG: all data comes from these published Google Sheet links ============
   Use a CSV link, or a .../pubhtml?gid=XXXX link (gid picks the tab). */
const CONFIG={
 /* Positions: Department, Section, Position Title, Geo, Company (As per HCM), Employment Status, Employee ID, Employee Name, Grade, Designation, Position Status */
 POSITIONS:'https://docs.google.com/spreadsheets/d/e/2PACX-1vRGyvSiihXPqbSRez8tNIxNEem49IDkeaqKHnOOGFQ-Su5pxvL2CamvqeQq15Xo3xUvvaUgtA25QHLM/pubhtml',
 /* Mastersheet 2026: Month, Company, Department, Current Headcount, Approved Headcount, Leavers (used for turnover) */
 MASTER:'https://docs.google.com/spreadsheets/d/e/2PACX-1vSMBPrqkOVprAn_sLjg2NmzGCimRx13XoDClYB7a4HMcX0j6MjqH9x7u9Z-NlWG2vAEzv16nPaMOIUU/pub?gid=1670338970&single=true&output=csv',
 /* Recruitment tab, one row per requisition: Company, Geo, Department, Position, Open Date, Offer Date, Offer Status, Join Date, Quality of Hire */
 RECRUIT:'',
 /* Exits tab, one row per leaver: Company, Geo, Department, Exit Date, Exit Reason */
 EXITS:''
};
/* KPI targets (edit freely). tov = annual turnover %. */
const TG={fill:95,ttf:45,oar:80,qoh:75,tov:15};
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],$=s=>document.querySelector(s);
const PR='#2563eb',DK='#1e3a8a',LT='#93b4f5',WN='#f0a35e';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nk=h=>String(h).toLowerCase().replace(/[^a-z0-9]/g,'');
const num=v=>{const t=String(v??'').replace(/[,\s%]/g,'');return t===''||t==='-'?NaN:parseFloat(t)};
const fN=v=>Math.round(v).toLocaleString('en-US'),fP=v=>(v||0).toFixed(1)+'%',fD=v=>(v||0).toFixed(0)+' days';
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const sum=(a,f)=>a.reduce((x,r)=>x+f(r),0);
let S={co:'All',geo:'All',sec:'All',dept:'All',y:0,m:-1},P=[],M=[],R=[],X=[],MISS=[],CH={},YS=[],LOADED=false,SC={k:'d',dir:1},SCQ='',SCROWS=[],SCT={},PS='All',PQ='',PK={k:'dept',dir:1},PREG=[],PROWS=[];

/* ---------- CSV + helpers ---------- */
function parseCSV(t){const r=[];let row=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}else if(c=='"')q=true;else if(c==','){row.push(f);f=''}else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;row.push(f);r.push(row);row=[];f=''}else f+=c}if(f!==''||row.length){row.push(f);r.push(row)}return r}
function table(text){const t=parseCSV(text).filter(r=>r.some(c=>String(c).trim()!==''));const h=t[0].map(nk);return t.slice(1).map(r=>{const o={};h.forEach((k,i)=>o[k]=String(r[i]??'').trim());return o})}
const pick=(o,al)=>{for(const a of al)if(o[a]!==undefined&&o[a]!=='')return o[a];return ''};
function pDate(s){s=String(s||'').trim();if(!s)return null;let m;
 if(m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/)){let y=+m[3];if(y<100)y+=2000;return new Date(y,+m[2]-1,+m[1])}
 if(m=s.match(/^(\d{1,2})[\-\s]([A-Za-z]{3})[a-z]*[\-\s,']*(\d{2,4})$/)){const mi=MN.findIndex(x=>x.toLowerCase()==m[2].toLowerCase());if(mi<0)return null;let y=+m[3];if(y<100)y+=2000;return new Date(y,mi,+m[1])}
 if(m=s.match(/^([A-Za-z]{3})[a-z]*[\-\s,'\/]*(\d{2,4})$/)){const mi=MN.findIndex(x=>x.toLowerCase()==m[1].toLowerCase());if(mi<0)return null;let y=+m[2];if(y<100)y+=2000;return new Date(y,mi,1)}
 const d=new Date(s);return isNaN(d)?null:d}
const A={co:['companyashcm','company','site','plant','unit'],geo:['geo','location','city','site'],dept:['department','dept'],sec:['section','subdepartment']};

/* ---------- normalisers ---------- */
function normPos(rows){return rows.map(o=>{
 const ps=pick(o,['positionstatus','status']),es=pick(o,['employmentstatus','employmenttype']),eid=pick(o,['employeeid','empid','employeecode']),en=pick(o,['employeename','name']);
 const s=ps.toLowerCase();let st;
 if(/vacan|open|unfill|hiring|requisition/.test(s))st='v';else if(/hold|freez|frozen|cancel|closed|abolish|inactive/.test(s))st='o';else if(/fill|occup|active|incumb/.test(s))st='f';else st=(eid||en)?'f':'v';
 return{co:pick(o,A.co),geo:pick(o,['geo','location','city']),dept:pick(o,A.dept),sec:pick(o,A.sec),pos:pick(o,['positiontitle','position','jobtitle']),grade:pick(o,['grade','jobgrade']),desig:pick(o,['designation']),es,eid,en,ps:ps||(st=='f'?'Filled':'Vacant'),st,tp:/3rd|third|contract|outsourc|agency|\btp\b|temporary|consult|daily/i.test(es)}}).filter(r=>r.dept)}
function normMaster(rows){return rows.map(o=>{const d=pDate(o.month);if(!d)return null;
 const cur=num(pick(o,['currentheadcount','currenthc','actualheadcount','headcount']));
 return{co:pick(o,['company']),dept:pick(o,A.dept),sec:pick(o,A.sec),y:d.getFullYear(),m:d.getMonth(),cur:isNaN(cur)?0:cur,lv:num(o.leavers)||0}}).filter(Boolean)}
function normRecruit(rows){return rows.map(o=>{
 const st=pick(o,['offerstatus','offer','offeroutcome']).toLowerCase();
 const open=pDate(pick(o,['opendate','requisitiondate','approvaldate','postingdate'])),offer=pDate(pick(o,['offerdate','offerissuedate'])),join=pDate(pick(o,['joindate','joiningdate','doj','dateofjoining']));
 let ttf=num(pick(o,['timetofill','daystofill','ttf']));if(isNaN(ttf)&&open&&join)ttf=Math.round((join-open)/864e5);
 let q=num(pick(o,['qualityofhire','qoh','qohscore','probationscore','performancescore']));if(!isNaN(q)&&q<=5)q=q*20;
 return{co:pick(o,A.co),geo:pick(o,['geo','location','city']),dept:pick(o,A.dept),sec:pick(o,A.sec),offer,join,ttf:isNaN(ttf)||ttf<0?null:ttf,q:isNaN(q)?null:q,off:/accept/.test(st)?'a':/declin|reject/.test(st)?'d':'p'}}).filter(r=>r.dept||r.co)}
function normExit(rows){return rows.map(o=>({co:pick(o,A.co),geo:pick(o,['geo','location','city']),dept:pick(o,A.dept),sec:pick(o,A.sec),d:pDate(pick(o,['exitdate','lastworkingdate','lwd','resignationdate','date'])),
 why:pick(o,['exitreason','reason','reasonforleaving','reasonofleaving','reasonforexit'])||'Not specified'})).filter(r=>r.dept||r.co)}

/* ---------- loading (Google Sheets only, no sample data) ---------- */
const csvUrl=u=>{const m=String(u).match(/^(.*?\/pub)html(?:\?(.*))?$/);if(!m)return u;const g=(m[2]||'').match(/gid=(\d+)/);return m[1]+'?'+(g?'gid='+g[1]+'&single=true&':'')+'output=csv'};
async function get(u){const res=await fetch(csvUrl(u),{cache:'no-store'});if(!res.ok)throw new Error('HTTP '+res.status);return res.text()}
const ids={fc:'co',fg:'geo',fd:'dept',fs:'sec',fy:'y'};
const syncSel=()=>Object.keys(ids).forEach(id=>{$('#'+id).value=S[ids[id]]});
async function init(){const er=[];
 async function load(name,url,norm){if(!url){MISS.push(name);return[]}try{const t=norm(table(await get(url)));if(!t.length)throw new Error('no usable rows');return t}catch(e){er.push(name+': '+e.message);return[]}}
 [P,M,R,X]=await Promise.all([load('POSITIONS',CONFIG.POSITIONS,normPos),load('MASTER',CONFIG.MASTER,normMaster),load('RECRUIT',CONFIG.RECRUIT,normRecruit),load('EXITS',CONFIG.EXITS,normExit)]);
 if(er.length){const e=$('#er');e.style.display='block';e.textContent='Could not read: '+er.join('  |  ')+'. Check the sheet is published to the web.'}
 if(MISS.length){const d=$('#dm');d.style.display='block';d.textContent='Not linked yet: '+MISS.join(', ')+'. Paste the published link of that tab in CONFIG (top of the script); related cards stay empty until then.'}
 YS=[...new Set([...M.map(r=>r.y),...R.filter(r=>r.join).map(r=>r.join.getFullYear()),...X.filter(r=>r.d).map(r=>r.d.getFullYear())])].sort((a,b)=>b-a);
 if(!YS.length)YS=[new Date().getFullYear()];S.y=YS[0];
 const u=k=>[...new Set([...P,...M,...R,...X].map(r=>r[k]).filter(Boolean))].sort();
 const fill=(id,a,all)=>{$(id).innerHTML=all.concat(a).map(([v,l])=>`<option value="${esc(v)}">${esc(l)}</option>`).join('')};
 const all=[['All','All']];fill('#fc',u('co').map(c=>[c,c]),all);fill('#fg',[...new Set([...P,...R,...X].map(r=>r.geo).filter(Boolean))].sort().map(c=>[c,c]),all);fill('#fd',u('dept').map(c=>[c,c]),all);fill('#fs',u('sec').map(c=>[c,c]),all);
 fill('#fy',YS.map(y=>[y,y]),[]);

 let h=`<div class="kg">${kpi('hc','Actual headcount',fN(fl.length),'Approved '+fN(ap),{hero:1,ic:'people',f:fN,raw:fl.length,tip:'Actual headcount: '+fN(fl.length)+'\nApproved: '+fN(ap)+'\nVacant: '+fN(vc.length)})}${kpi('vac','Vacant positions',fN(vc.length),ap?fP(vc.length/ap*100)+' of approved':'',{ic:'add',f:fN,raw:vc.length,c:vc.length?'b':'g'})}${kpi('org','Org chart fill rate',org==null?'–':fP(org),'Target ≥'+TG.fill+'%',{ic:'target',f:fP,raw:org||0,c:gd(org==null?null:org>=TG.fill),tip:'Filled ÷ approved\nTarget ≥'+TG.fill+'%'})}${kpi('pt','Perm : 3rd party',ratio,fN(perm)+' · '+fN(tp),{ic:'work',tip:'Permanent: '+fN(perm)+'\n3rd party: '+fN(tp)})}${kpi('tov','Employee turnover',tov==null?'–':fP(tov),'Target ≤'+tTov.toFixed(1)+'%',{ic:'walk',f:fP,raw:tov||0,sp:spark(sV,fP),c:gd(tov==null?null:tov<=tTov),tip:'Employee turnover · '+per+'\nTarget ≤'+tTov.toFixed(1)+'%'})}${kpi('ttf','Time to fill',ttf==null?'–':fD(ttf),'Target ≤'+TG.ttf+' days',{ic:'clock',f:fD,raw:ttf||0,sp:spark(sT,fD),c:gd(ttf==null?null:ttf<=TG.ttf),tip:'Time to fill · '+per})}${kpi('oar','Offer acceptance',oar==null?'–':fP(oar),'Target ≥'+TG.oar+'%',{ic:'check',f:fP,raw:oar||0,sp:spark(sO,fP),c:gd(oar==null?null:oar>=TG.oar),tip:'Offer acceptance · '+per})}${kpi('qoh','Quality of hire',qoh==null?'–':fP(qoh),'Target ≥'+TG.qoh+'%',{ic:'trend',f:fP,raw:qoh||0,sp:spark(sQ,fP),c:gd(qoh==null?null:qoh>=TG.qoh),tip:'Quality of hire · '+per})}${kpi('xr','Top exit reason',top?esc(top[0]):'–',top?Math.round(top[1]/xp.length*100)+'% of '+xp.length+' exits':'No exits',{ic:'doc'})}</div>`;
 const ins=[];if(S.dept!='All')ins.push('Filtered: '+S.dept+' (click Reset to clear)');if(org!=null)ins.push('Org chart '+fP(org)+' filled · '+fN(vc.length)+' vacant');if(dRate[0]&&dRate[0][1]<100)ins.push('Lowest fill: '+dRate[0][0]+' ('+fP(dRate[0][1])+')');if(ttf!=null)ins.push('Avg time to fill: '+fD(ttf));if(top)ins.push('Most exits: '+top[0]);if(tov!=null)ins.push('Turnover '+fP(tov));
 h+=`<div class="ins">${ins.map(i=>`<div>${esc(i)}</div>`).join('')}</div>`;

 /* department scorecard data (ignores the department filter so you can switch rows) */
 const A0=P.filter(r=>eq(S.co,r.co)&&eq(S.geo,r.geo)&&eq(S.sec,r.sec)),mA=M.filter(r=>ln(S.co,r.co)&&ln(S.sec,r.sec)&&r.y==S.y),msA=[...new Set(mA.filter(r=>S.m<0||r.m==S.m).map(r=>r.m))],jA=R.filter(r=>ln(S.co,r.co)&&ln(S.geo,r.geo)&&ln(S.sec,r.sec)&&inP(r.join));
 SCROWS=[...new Set([...A0.map(r=>r.dept),...mA.map(r=>r.dept)].filter(Boolean))].sort().map(d=>{const p=A0.filter(r=>r.dept==d),f=p.filter(r=>r.st=='f'),v=p.filter(r=>r.st=='v'),a=f.length+v.length;return{d,ap:a,f:f.length,v:v.length,fill:a?f.length/a*100:null,perm:f.filter(r=>!r.tp).length,tp:f.filter(r=>r.tp).length,tov:turnover(mA.filter(r=>r.dept==d),msA),ttf:ttfOf(jA.filter(r=>r.dept==d))}});
 {const ap=sum(SCROWS,r=>r.ap),f=sum(SCROWS,r=>r.f);SCT={ap,f,v:sum(SCROWS,r=>r.v),fill:ap?f/ap*100:null,perm:sum(SCROWS,r=>r.perm),tp:sum(SCROWS,r=>r.tp),tov:turnover(mA,msA),ttf:ttfOf(jA)}}

 h+=`<h2>Monthly trends <small>${per} · dashed line = target</small></h2><div class="g">`;
 h+=card('Time to fill',ttf==null?'':fD(ttf),nd('RECRUIT',hasJ,cv('h1')),'','clock')+card('Offer acceptance',oar==null?'':fP(oar),nd('RECRUIT',rr.length>0,cv('h2')),'','check')+card('Quality of hire',qoh==null?'':fP(qoh),nd('RECRUIT',hasJ,cv('h3')),'','trend')+card('Employee turnover',tov==null?'':fP(tov),nd('MASTER',hasM,cv('a1')),'','walk')+'</div>';

 h+=`<h2>Vacancies, workforce mix &amp; exits</h2><div class="g">`;
 h+=card('Vacant by site <small>(click to filter)</small>',fN(vc.length),nd('POSITIONS',siteV.length>0,'<div class="sc1">'+blist(siteV,fN,1,'geo')+'</div>'),'','add')+card('Permanent vs 3rd party',ratio=='–'?'':ratio,nd('POSITIONS',perm+tp>0,cv('p3')),'','work')+card('Top exit reasons',xp.length?xp.length+' exits':'',nd('EXITS',hasX,'<div class="sc1">'+blist(rs.slice(0,8),fN)+'</div>'),'','doc')+card('Vacant: department × site',fN(vc.length),'<div class="tw" id="hm" style="max-height:150px"></div>','w2','block')+'</div>';

 h+=`<h2>Department scorecard <small>click a row to filter · click a header to sort</small></h2><div class="c" style="--i:${card.n++}"><div class="tools"><input class="sr" id="scq" type="search" placeholder="Search department…" value="${esc(SCQ)}"><span class="sub">Approved vs actual, vacancy, fill rate, perm/3rd party, turnover and time to fill per department</span></div><div class="tw" style="max-height:340px"><table class="sc" id="sct"></table></div></div>`;
 h+=`<h2>Position register <small>filled vs vacant, straight from the Positions sheet · follows the filters above</small></h2><div class="c" style="--i:${card.n++}"><div class="tools"><input class="sr" id="prq" type="search" placeholder="Search position, employee, grade…" value="${esc(PQ)}"><span class="seg2" id="prb"></span><span class="grow"></span><button class="btn" data-ex="1">Export CSV</button></div><div class="tw" style="max-height:360px"><table class="sc pr" id="prt"></table></div><div class="sub" id="prn" style="margin-top:6px"></div></div>`;
 PREG=pr.slice();
 $('#app').innerHTML=h;pills(mr,rr);countUp();drawSC();drawPR();$('#scq').oninput=e=>{SCQ=e.target.value;drawSC()};$('#prq').oninput=e=>{PQ=e.target.value;drawPR()};

 if(hasJ){line('h1',sT,v=>v==null?'–':fD(v),TG.ttf);line('h3',sQ,fP,TG.qoh)}
 if(rr.length)line('h2',sO,fP,TG.oar);
 if(hasM)line('a1',sV,fP,TG.tov/12);
 if(perm+tp)mk('p3',{type:'doughnut',data:{labels:['Permanent','3rd party'],datasets:[{data:[perm,tp],backgroundColor:[DK,WN],borderColor:'transparent'}]},options:{cutout:'62%',plugins:{legend:{display:true,position:'right',labels:{color:css('--mu'),boxWidth:10}}}}});
 $('#hm').innerHTML=`<table><thead><tr><th>Department</th>${sites.map(s=>`<th>${esc(s)}</th>`).join('')}<th>Total</th></tr></thead><tbody>${dp.map(d=>{let t=0;const cells=sites.map(s=>{const v=vm[d+'|'+s]||0;t+=v;return `<td class="hm" style="${v?`background:rgba(var(--warm),${(.15+.6*v/mx).toFixed(2)})`:''}">${v||'–'}</td>`}).join('');return `<tr><td>${esc(d)}</td>${cells}<td class="hm">${t||'–'}</td></tr>`}).join('')||'<tr><td colspan="9" class="msg">No positions</td></tr>'}</tbody></table>`}
document.addEventListener('click',e=>{const T=e.target.closest&&e.target.closest('[data-m],[data-sk],[data-dp],[data-fk],[data-ps],[data-pk],[data-ex]');if(!T)return;const d=T.dataset;
 if(d.m!==undefined)S.m=+d.m;
 else if(d.ps!==undefined){PS=d.ps;return drawPR()}
 else if(d.pk){if(PK.k==d.pk)PK.dir*=-1;else{PK.k=d.pk;PK.dir=1}return drawPR()}
 else if(d.ex){return csvOut(PROWS)}
 else if(d.sk){if(SC.k==d.sk)SC.dir*=-1;else{SC.k=d.sk;SC.dir=d.sk=='d'?1:-1}return drawSC()}
 else if(d.dp!==undefined)S.dept=S.dept==d.dp?'All':d.dp;
 else if(d.fk)S[d.fk]=S[d.fk]==d.fv?'All':d.fv;
 syncSel();render()});
try{const t=localStorage.getItem('hr-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
init().catch(e=>{$('#app').innerHTML='<div class="msg">Could not start: '+esc(e.message)+'</div>'});
</script>
</body></html>
